<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <meta
    name="description"
    content="Daniil Zorin — personal portfolio."
  />
  <meta name="theme-color" content="#050304" />
  <title>Daniil Zorin — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --black: #050304;
      --deep-black: #020102;
      --soft-black: #0d080a;
      --ivory: #eee7df;
      --cream: #d7c9c3;
      --muted: #8c7d7c;
      --dim: #55494b;
      --wine: #3d0b17;
      --wine-mid: #641629;
      --wine-light: #8f3048;
      --wine-glow: rgba(112, 22, 46, 0.28);
      --rose: #a66b79;
      --line: rgba(238, 231, 223, 0.11);
      --line-strong: rgba(238, 231, 223, 0.22);
      --max-width: 1280px;
      --padding: 42px;
      --display-font: "Bodoni Moda", serif;
      --body-font: "Inter", sans-serif;
      --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html {
      scroll-behavior: smooth;
      background: var(--black);
    }
    body {
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(
          circle at 75% 10%,
          rgba(88, 13, 35, 0.16),
          transparent 28%
        ),
        radial-gradient(
          circle at 15% 70%,
          rgba(67, 9, 28, 0.12),
          transparent 30%
        ),
        var(--black);
      color: var(--ivory);
      font-family: var(--body-font);
      font-weight: 300;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    body.lightbox-open {
      overflow: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      opacity: 0.035;
      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
    }
    ::selection {
      color: var(--ivory);
      background: var(--wine-mid);
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    button {
      font: inherit;
    }
    img {
      display: block;
      width: 100%;
    }
    .wrap {
      width: min(
        calc(100% - (var(--padding) * 2)),
        var(--max-width)
      );
      margin: 0 auto;
    }
    /* =========================
       NAVIGATION
    ========================= */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      padding: 26px var(--padding);
      border-bottom: 1px solid transparent;
      transition:
        background 0.5s ease,
        backdrop-filter 0.5s ease,
        border-color 0.5s ease;
    }
    .nav.scrolled {
      background: rgba(5, 3, 4, 0.72);
      backdrop-filter: blur(18px);
      border-bottom-color: var(--line);
    }
    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(100%, var(--max-width));
      margin: 0 auto;
    }
    .nav-logo {
      font-family: var(--display-font);
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.02em;
      transition: color 0.3s ease;
    }
    .nav-logo:hover {
      color: var(--rose);
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
      list-style: none;
    }
    .nav-links a {
      position: relative;
      color: var(--muted);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      transition: color 0.3s ease;
    }
    .nav-links a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -7px;
      width: 100%;
      height: 1px;
      background: var(--wine-light);
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 0.4s var(--ease);
    }
    .nav-links a:hover,
    .nav-links a:focus-visible {
      color: var(--ivory);
    }
    .nav-links a:hover::after,
    .nav-links a:focus-visible::after {
      transform: scaleX(1);
      transform-origin: left;
    }
    /* =========================
       HERO
    ========================= */
    .hero {
      position: relative;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: var(--deep-black);
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        linear-gradient(
          180deg,
          rgba(2, 1, 2, 0.15),
          rgba(2, 1, 2, 0.65)
        ),
        radial-gradient(
          circle at center,
          transparent 25%,
          rgba(0, 0, 0, 0.65) 100%
        );
    }
    .hero-image {
      position: absolute;
      inset: -5%;
      width: 110%;
      height: 110%;
      object-fit: cover;
      opacity: 0.76;
      filter:
        saturate(0.72)
        contrast(1.08)
        brightness(0.66);
      transform:
        translate3d(0, 0, 0)
        scale(1.04);
      will-change: transform;
      transition: opacity 0.8s ease;
    }
    .hero:hover .hero-image {
      opacity: 0.82;
    }
    .hero-content {
      position: relative;
      z-index: 3;
      width: 100%;
      padding: 150px var(--padding) 80px;
      text-align: center;
    }
    .hero-kicker {
      margin-bottom: 25px;
      color: rgba(238, 231, 223, 0.62);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.42em;
      text-transform: uppercase;
    }
    .hero-title {
      margin: 0;
      color: var(--ivory);
      font-family: var(--display-font);
      font-size: clamp(70px, 13vw, 190px);
      font-weight: 400;
      line-height: 0.83;
      letter-spacing: -0.055em;
      text-shadow:
        0 15px 45px rgba(0, 0, 0, 0.45);
    }
    .hero-title span {
      display: block;
    }
    .hero-title span:last-child {
      margin-left: 8vw;
    }
    .hero-bottom {
      position: absolute;
      left: var(--padding);
      right: var(--padding);
      bottom: 38px;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: rgba(238, 231, 223, 0.5);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }
    .scroll-indicator {
      display: flex;
      align-items: center;
      gap: 13px;
    }
    .scroll-line {
      width: 45px;
      height: 1px;
      background: rgba(238, 231, 223, 0.4);
    }
    /* =========================
       SECTIONS
    ========================= */
    section {
      position: relative;
      scroll-margin-top: 90px;
    }
    .about {
      padding: 170px 0 180px;
      background:
        radial-gradient(
          circle at 80% 40%,
          rgba(76, 10, 31, 0.12),
          transparent 32%
        ),
        var(--black);
    }
    .work {
      padding: 160px 0 180px;
      background:
        linear-gradient(
          180deg,
          var(--black),
          var(--soft-black)
        );
    }
    .contact {
      padding: 160px 0 80px;
      background: var(--deep-black);
    }
    /* =========================
       SECTION HEADERS
    ========================= */
    .section-header {
      display: flex;
      align-items: flex-start;
      gap: 30px;
      margin-bottom: 80px;
      border-top: 1px solid var(--line);
      padding-top: 20px;
    }
    .section-number {
      color: var(--wine-light);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.2em;
    }
    .section-title {
      color: var(--ivory);
      font-family: var(--display-font);
      font-size: clamp(50px, 8vw, 105px);
      font-weight: 400;
      line-height: 0.9;
      letter-spacing: -0.045em;
    }
    /* =========================
       ABOUT
    ========================= */
    .about-content {
      width: 100%;
      min-height: 220px;
      padding: 70px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    /* =========================
       WORK
    ========================= */
    .work-header {
      display: flex;
      align-items: flex-start;
      gap: 30px;
      margin-bottom: 55px;
      border-top: 1px solid var(--line);
      padding-top: 20px;
    }
    .work-title {
      color: var(--ivory);
      font-family: var(--display-font);
      font-size: clamp(55px, 9vw, 120px);
      font-weight: 400;
      line-height: 0.85;
      letter-spacing: -0.055em;
    }
    .work-text-field {
      width: 100%;
      min-height: 220px;
      margin-bottom: 75px;
      padding: 38px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    /* =========================
       GALLERY
    ========================= */
    .gallery {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 28px;
    }
    .gallery-item {
      position: relative;
      overflow: hidden;
      background: #090607;
    }
    .gallery-item:nth-child(1) {
      grid-column: span 7;
    }
    .gallery-item:nth-child(2) {
      grid-column: span 5;
      margin-top: 130px;
    }
    .gallery-item:nth-child(3) {
      grid-column: span 5;
    }
    .gallery-item:nth-child(4) {
      grid-column: span 7;
      margin-top: -80px;
    }
    .gallery-item:nth-child(5) {
      grid-column: 3 / span 7;
      margin-top: 80px;
    }
    .gallery-button {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      text-align: left;
    }
    .gallery-item::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(
          180deg,
          transparent 45%,
          rgba(0, 0, 0, 0.35)
        );
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .gallery-item:hover::after,
    .gallery-item:focus-within::after {
      opacity: 1;
    }
    .gallery-item img {
      height: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      filter:
        saturate(0.75)
        contrast(1.05);
      transform: scale(1.001);
      transition:
        transform 1s var(--ease),
        filter 0.8s ease;
    }
    .gallery-item:hover img,
    .gallery-button:focus-visible img {
      transform: scale(1.045);
      filter:
        saturate(0.92)
        contrast(1.08);
    }
    .gallery-button:focus-visible {
      outline: 1px solid var(--wine-light);
      outline-offset: 5px;
    }
    /* =========================
       CONTACT
    ========================= */
    .contact-header {
      display: flex;
      align-items: flex-start;
      gap: 30px;
      margin-bottom: 90px;
      border-top: 1px solid var(--line);
      padding-top: 20px;
    }
    .contact-title {
      color: var(--ivory);
      font-family: var(--display-font);
      font-size: clamp(60px, 10vw, 140px);
      font-weight: 400;
      line-height: 0.82;
      letter-spacing: -0.055em;
    }
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      border-top: 1px solid var(--line);
    }
    .contact-link {
      position: relative;
      display: block;
      padding: 28px 0;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      transition:
        color 0.35s ease,
        padding-left 0.45s var(--ease);
    }
    .contact-link::after {
      content: "↗";
      position: absolute;
      right: 0;
      top: 25px;
      color: var(--wine-light);
      opacity: 0;
      transform: translate(-8px, 8px);
      transition:
        opacity 0.35s ease,
        transform 0.45s var(--ease);
    }
    .contact-link:hover,
    .contact-link:focus-visible {
      padding-left: 10px;
      color: var(--ivory);
    }
    .contact-link:hover::after,
    .contact-link:focus-visible::after {
      opacity: 1;
      transform: translate(0, 0);
    }
    /* =========================
       FOOTER
    ========================= */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 130px;
      padding-top: 25px;
      border-top: 1px solid var(--line);
      color: var(--dim);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    /* =========================
       LIGHTBOX
    ========================= */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      background: rgba(2, 1, 2, 0.94);
      opacity: 0;
      visibility: hidden;
      transition:
        opacity 0.45s ease,
        visibility 0.45s ease;
    }
    .lightbox.active {
      opacity: 1;
      visibility: visible;
    }
    .lightbox img {
      width: auto;
      max-width: min(90vw, 1100px);
      max-height: 88vh;
      object-fit: contain;
      box-shadow:
        0 35px 100px rgba(0, 0, 0, 0.65);
      transform: scale(0.96);
      transition:
        transform 0.5s var(--ease);
    }
    .lightbox.active img {
      transform: scale(1);
    }
    .lightbox-close {
      position: absolute;
      top: 30px;
      right: 35px;
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line-strong);
      background: transparent;
      color: var(--ivory);
      font-size: 22px;
      font-weight: 300;
      cursor: pointer;
      transition:
        background 0.3s ease,
        border-color 0.3s ease;
    }
    .lightbox-close:hover,
    .lightbox-close:focus-visible {
      background: var(--wine);
      border-color: var(--wine-light);
    }
    /* =========================
       REVEAL
    ========================= */
    .reveal {
      opacity: 0;
      transform: translateY(35px);
      transition:
        opacity 0.9s var(--ease),
        transform 1s var(--ease);
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }
    /* =========================
       RESPONSIVE
    ========================= */
    @media (max-width: 800px) {
      :root {
        --padding: 22px;
      }
      .nav {
        padding: 20px var(--padding);
      }
      .nav-links {
        gap: 17px;
      }
      .nav-links a {
        font-size: 8px;
        letter-spacing: 0.14em;
      }
      .nav-logo {
        font-size: 16px;
      }
      .hero-content {
        padding: 130px var(--padding) 70px;
      }
      .hero-title {
        font-size: clamp(58px, 17vw, 110px);
        line-height: 0.88;
      }
      .hero-title span:last-child {
        margin-left: 7vw;
      }
      .hero-bottom {
        left: var(--padding);
        right: var(--padding);
        bottom: 25px;
      }
      .about,
      .work,
      .contact {
        padding: 110px 0;
      }
      .section-header,
      .work-header,
      .contact-header {
        gap: 18px;
        margin-bottom: 55px;
      }
      .section-title,
      .work-title,
      .contact-title {
        font-size: clamp(48px, 15vw, 85px);
      }
      .about-content,
      .work-text-field {
        min-height: 170px;
      }
      .gallery {
        display: block;
      }
      .gallery-item,
      .gallery-item:nth-child(1),
      .gallery-item:nth-child(2),
      .gallery-item:nth-child(3),
      .gallery-item:nth-child(4),
      .gallery-item:nth-child(5) {
        width: 100%;
        margin: 0 0 24px;
      }
      .gallery-item img {
        aspect-ratio: 4 / 5;
      }
      .contact-grid {
        grid-template-columns: 1fr;
      }
      .footer {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        margin-top: 90px;
      }
      .lightbox {
        padding: 20px;
      }
      .lightbox img {
        max-width: 94vw;
        max-height: 82vh;
      }
      .lightbox-close {
        top: 18px;
        right: 18px;
      }
    }
    @media (max-width: 480px) {
      .nav-links {
        gap: 12px;
      }
      .nav-links a {
        font-size: 7px;
      }
      .hero-kicker {
        font-size: 8px;
        letter-spacing: 0.28em;
      }
      .hero-bottom {
        font-size: 7px;
      }
      .scroll-line {
        width: 28px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
      .reveal {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <!-- =========================
       NAVIGATION
  ========================= -->
  <header class="nav" id="nav">
    <div class="nav-inner">
      <a
        href="#home"
        class="nav-logo"
        aria-label="Daniil Zorin — Home"
      >
        Daniil Zorin
      </a>
      <nav aria-label="Main navigation">
        <ul class="nav-links">
          <li>
            <a href="#home">Home</a>
          </li>
          <li>
            <a href="#about">About</a>
          </li>
          <li>
            <a href="#work">Work</a>
          </li>
          <li>
            <a href="#contact">Contact</a>
          </li>
        </ul>
      </nav>
    </div>
  </header>
  <!-- =========================
       MAIN
  ========================= -->
  <main>
    <!-- =========================
         HERO
    ========================= -->
    <section class="hero" id="home">
      <img
        class="hero-image"
        src="Facetune_15-06-2026-23-14-00.jpeg"
        alt=""
        aria-hidden="true"
        fetchpriority="high"
        decoding="async"
      />
      <div class="hero-content">
        <p class="hero-kicker">
          Personal Portfolio
        </p>
        <h1 class="hero-title">
          <span>Daniil</span>
          <span>Zorin</span>
        </h1>
      </div>
      <div class="hero-bottom">
        <span>
          Portfolio / 2026
        </span>
        <div
          class="scroll-indicator"
          aria-hidden="true"
        >
          <span class="scroll-line"></span>
          <span>Scroll</span>
        </div>
      </div>
    </section>
    <!-- =========================
         ABOUT
    ========================= -->
    <section
      class="about"
      id="about"
      aria-labelledby="about-title"
    >
      <div class="wrap">
        <div class="section-header reveal">
          <span
            class="section-number"
            aria-hidden="true"
          >
            01
          </span>
          <h2
            class="section-title"
            id="about-title"
          >
            About
          </h2>
        </div>
        <div
          class="about-content reveal"
        ></div>
      </div>
    </section>
    <!-- =========================
         WORK
    ========================= -->
    <section
      class="work"
      id="work"
      aria-labelledby="work-title"
    >
      <div class="wrap">
        <div class="work-header reveal">
          <span
            class="section-number"
            aria-hidden="true"
          >
            02
          </span>
          <h2
            class="work-title"
            id="work-title"
          >
            Selected Work
          </h2>
        </div>
        <div class="work-text-field reveal"></div>
        <!-- GALLERY -->
        <div class="gallery">
          <figure class="gallery-item reveal">
            <button
              class="gallery-button"
              type="button"
              aria-label="Open portfolio image 1"
            >
              <img
                src="portfolio-01.jpg"
                alt="Daniil Zorin portfolio image 1"
                loading="lazy"
                decoding="async"
              />
            </button>
          </figure>
          <figure class="gallery-item reveal">
            <button
              class="gallery-button"
              type="button"
              aria-label="Open portfolio image 2"
            >
              <img
                src="portfolio-02.jpg"
                alt="Daniil Zorin portfolio image 2"
                loading="lazy"
                decoding="async"
              />
            </button>
          </figure>
          <figure class="gallery-item reveal">
            <button
              class="gallery-button"
              type="button"
              aria-label="Open portfolio image 3"
            >
              <img
                src="portfolio-03.jpg"
                alt="Daniil Zorin portfolio image 3"
                loading="lazy"
                decoding="async"
              />
            </button>
          </figure>
          <figure class="gallery-item reveal">
            <button
              class="gallery-button"
              type="button"
              aria-label="Open portfolio image 4"
            >
              <img
                src="portfolio-04.jpg"
                alt="Daniil Zorin portfolio image 4"
                loading="lazy"
                decoding="async"
              />
            </button>
          </figure>
          <figure class="gallery-item reveal">
            <button
              class="gallery-button"
              type="button"
              aria-label="Open portfolio image 5"
            >
              <img
                src="portfolio-05.jpg"
                alt="Daniil Zorin portfolio image 5"
                loading="lazy"
                decoding="async"
              />
            </button>
          </figure>
        </div>
      </div>
    </section>
    <!-- =========================
         CONTACT
    ========================= -->
    <section
      class="contact"
      id="contact"
      aria-labelledby="contact-title"
    >
      <div class="wrap">
        <div class="contact-header reveal">
          <span
            class="section-number"
            aria-hidden="true"
          >
            03
          </span>
          <h2
            class="contact-title"
            id="contact-title"
          >
            Contact
          </h2>
        </div>
        <div class="contact-grid reveal">
          <a
            class="contact-link"
            href="https://www.instagram.com/zirochkatorrent"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram — opens in a new tab"
          >
            Instagram
          </a>
          <a
            class="contact-link"
            href="mailto:zirochkatorrent@icloud.com"
          >
            Email
          </a>
        </div>
        <footer class="footer">
          <span>
            Daniil Zorin
          </span>
          <span>
            © 2026
          </span>
        </footer>
      </div>
    </section>
  </main>
  <!-- =========================
       LIGHTBOX
  ========================= -->
  <div
    class="lightbox"
    id="lightbox"
    role="dialog"
    aria-modal="true"
    aria-hidden="true"
    aria-label="Image preview"
  >
    <button
      class="lightbox-close"
      id="lightboxClose"
      type="button"
      aria-label="Close image preview"
    >
      ×
    </button>
    <img
      id="lightboxImage"
      src=""
      alt=""
      decoding="async"
    />
  </div>
  <script>
    "use strict";
    /* =========================
       NAVIGATION
    ========================= */
    const nav = document.getElementById("nav");
    function updateNavigation() {
      if (!nav) return;
      nav.classList.toggle(
        "scrolled",
        window.scrollY > 50
      );
    }
    window.addEventListener(
      "scroll",
      updateNavigation,
      { passive: true }
    );
    updateNavigation();
    /* =========================
       SCROLL REVEAL
    ========================= */
    const revealElements =
      document.querySelectorAll(".reveal");
    if ("IntersectionObserver" in window) {
      const revealObserver =
        new IntersectionObserver(
          (entries, observer) => {
            entries.forEach((entry) => {
              if (!entry.isIntersecting) {
                return;
              }
              entry.target.classList.add("visible");
              observer.unobserve(entry.target);
            });
          },
          {
            threshold: 0.12,
            rootMargin: "0px 0px -40px 0px"
          }
        );
      revealElements.forEach((element) => {
        revealObserver.observe(element);
      });
    } else {
      revealElements.forEach((element) => {
        element.classList.add("visible");
      });
    }
    /* =========================
       HERO PARALLAX
    ========================= */
    const heroImage =
      document.querySelector(".hero-image");
    let ticking = false;
    function updateParallax() {
      if (!heroImage) {
        ticking = false;
        return;
      }
      const scrollY = window.scrollY;
      const heroHeight = window.innerHeight;
      if (scrollY <= heroHeight) {
        const movement = scrollY * 0.16;
        heroImage.style.transform =
          `translate3d(0, ${movement}px, 0) scale(1.04)`;
      }
      ticking = false;
    }
    window.addEventListener(
      "scroll",
      () => {
        if (ticking) {
          return;
        }
        window.requestAnimationFrame(
          updateParallax
        );
        ticking = true;
      },
      { passive: true }
    );
    /* =========================
       LIGHTBOX
    ========================= */
    const lightbox =
      document.getElementById("lightbox");
    const lightboxImage =
      document.getElementById("lightboxImage");
    const lightboxClose =
      document.getElementById("lightboxClose");
    const galleryButtons =
      document.querySelectorAll(".gallery-button");
    let lastFocusedElement = null;
    function openLightbox(image) {
      if (
        !lightbox ||
        !lightboxImage ||
        !image ||
        image.hidden
      ) {
        return;
      }
      lastFocusedElement =
        document.activeElement;
      lightboxImage.src =
        image.currentSrc || image.src;
      lightboxImage.alt =
        image.alt || "Portfolio image";
      lightbox.classList.add("active");
      lightbox.setAttribute(
        "aria-hidden",
        "false"
      );
      document.body.classList.add(
        "lightbox-open"
      );
      lightboxClose?.focus();
    }
    function closeLightbox() {
      if (!lightbox) {
        return;
      }
      lightbox.classList.remove("active");
      lightbox.setAttribute(
        "aria-hidden",
        "true"
      );
      document.body.classList.remove(
        "lightbox-open"
      );
      setTimeout(() => {
        if (
          !lightbox.classList.contains("active") &&
          lightboxImage
        ) {
          lightboxImage.src = "";
          lightboxImage.alt = "";
        }
      }, 450);
      if (
        lastFocusedElement &&
        typeof lastFocusedElement.focus === "function"
      ) {
        lastFocusedElement.focus();
      }
    }
    galleryButtons.forEach((button) => {
      const image =
        button.querySelector("img");
      if (!image) {
        return;
      }
      button.addEventListener(
        "click",
        () => {
          openLightbox(image);
        }
      );
    });
    lightboxClose?.addEventListener(
      "click",
      closeLightbox
    );
    lightbox?.addEventListener(
      "click",
      (event) => {
        if (
          event.target === lightbox
        ) {
          closeLightbox();
        }
      }
    );
    document.addEventListener(
      "keydown",
      (event) => {
        if (
          event.key === "Escape" &&
          lightbox?.classList.contains("active")
        ) {
          closeLightbox();
        }
      }
    );
    /* =========================
       IMAGE ERROR HANDLING
    ========================= */
    const allImages =
      document.querySelectorAll("img");
    allImages.forEach((image) => {
      image.addEventListener(
        "error",
        () => {
          image.hidden = true;
          const button =
            image.closest(".gallery-button");
          if (button) {
            button.disabled = true;
            button.setAttribute(
              "aria-hidden",
              "true"
            );
          }
        }
      );
    });
    /* =========================
       SMOOTH NAVIGATION
    ========================= */
    document
      .querySelectorAll('a[href^="#"]')
      .forEach((link) => {
        link.addEventListener(
          "click",
          (event) => {
            const targetId =
              link.getAttribute("href");
            if (
              !targetId ||
              targetId === "#"
            ) {
              return;
            }
            const target =
              document.querySelector(targetId);
            if (!target) {
              return;
            }
            event.preventDefault();
            target.scrollIntoView({
              behavior:
                window.matchMedia(
                  "(prefers-reduced-motion: reduce)"
                ).matches
                  ? "auto"
                  : "smooth",
              block: "start"
            });
          }
        );
      });
  </script>
</body>
</html>
