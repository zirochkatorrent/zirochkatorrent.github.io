  <link

    rel="stylesheet"

  <style>
    :root {
      --bg: #080808;
      --text: #f4f4f0;
      --line: #252525;
      --muted: rgba(244, 244, 240, 0.45);
      --muted-light: rgba(244, 244, 240, 0.7);
      --content-width: 1180px;
      --side-padding: 48px;
    }
    * {
      box-sizing: border-box;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", sans-serif;
      font-weight: 300;
      line-height: 1.5;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    .wrap {
      width: min(
        var(--content-width),
        calc(100% - var(--side-padding) * 2)
      );
      margin-inline: auto;
    }
    /* Header */
    .site-header {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 0 34px;
    }
    .nav {
      display: flex;
      justify-content: flex-end;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--muted);
    }
    /* Hero */
    .hero {
      padding: 8vh 0 7vh;
    }
    .eyebrow,
    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.24em;
      color: var(--muted);
    }
    .eyebrow {
      margin-bottom: 24px;
    }
    .hero-title {
      margin: 0;
      font-family: "Playfair Display", serif;
      font-size: clamp(64px, 13vw, 170px);
      line-height: 0.86;
      font-weight: 500;
      letter-spacing: -0.055em;
    }
    .role {
      margin-top: 34px;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--muted-light);
    }
    /* Main photo */
    .photo {
      margin-top: 55px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #090909;
    }
    .photo img {
      display: block;
      width: 100%;
      max-height: 760px;
      height: auto;
      object-fit: cover;
      object-position: center;
    }
    /* Sections */
    section {
      padding: 120px 0;
      border-top: 1px solid #202020;
    }
    .section-title {
      margin-bottom: 42px;
    }
    .section-content {
      max-width: 700px;
    }
    /* Links */
    .link-list {
      max-width: 700px;
    }
    .link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 22px 0;
      border-bottom: 1px solid var(--line);
      font-size: 18px;
      transition:
        opacity 0.25s ease,
        padding-left 0.25s ease;
    }
    .link:hover {
      opacity: 0.55;
      padding-left: 6px;
    }
    .arrow {
      color: var(--muted);
      transition: transform 0.25s ease;
    }
    .link:hover .arrow {
      transform: translate(3px, -3px);
    }
    /* Footer */
    footer {
      padding: 34px 0 50px;
      border-top: 1px solid #202020;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--muted);
    }
    /* Mobile */
    @media (max-width: 600px) {
      :root {
        --side-padding: 16px;
      }
      .site-header {
        padding-top: 20px;
      }
      .hero {
        padding-top: 15vh;
      }
      .hero-title {
        font-size: clamp(58px, 20vw, 100px);
      }
      .photo {
        margin-top: 40px;
      }
      section {
        padding: 85px 0;
      }
      .link {
        font-size: 16px;
      }
    }
    /* Accessibility */
    :focus-visible {
      outline: 1px solid var(--text);
      outline-offset: 5px;
    }
    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>
