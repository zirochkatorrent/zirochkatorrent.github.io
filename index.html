<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Daniil Zorin — model and blogger."
  >
  <meta
    name="robots"
    content="index, follow"
  >

  <title>Daniil Zorin</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    /* =========================================================
       VARIABLES
    ========================================================= */

    :root {
      --black: #050505;
      --soft-black: #090909;
      --white: #eeeae4;
      --muted: #77736e;
      --line: #242220;

      --max-width: 1280px;
      --padding: 42px;
    }


    /* =========================================================
       RESET
    ========================================================= */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      overflow-x: hidden;

      background: var(--black);
      color: var(--white);

      font-family: "Inter", sans-serif;
      font-weight: 300;
    }

    body.no-scroll {
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      margin: 0;
      padding: 0;

      border: 0;
      background: transparent;

      color: inherit;
      font: inherit;
    }

    img {
      display: block;
      width: 100%;
    }

    ::selection {
      background: var(--white);
      color: var(--black);
    }

    :focus-visible {
      outline: 1px solid var(--white);
      outline-offset: 6px;
    }


    /* =========================================================
       GRAIN
    ========================================================= */

    body::after {
      content: "";

      position: fixed;
      inset: 0;
      z-index: 9999;

      pointer-events: none;

      opacity: 0.035;
      mix-blend-mode: screen;

      background-image: url(
        "data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E"
      );
    }


    /* =========================================================
       GLOBAL LAYOUT
    ========================================================= */

    .wrap {
      width: min(
        var(--max-width),
        calc(100% - var(--padding) * 2)
      );

      margin-inline: auto;
    }

    section {
      border-top: 1px solid var(--line);
    }


    /* =========================================================
       NAVIGATION
    ========================================================= */

    .nav {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      z-index: 100;

      padding: 28px 0;

      mix-blend-mode: difference;
    }

    .nav-inner {
      display: flex;
      align-items: center;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .logo-button {
      display: block;

      color: var(--white);

      font-family: "Cormorant Garamond", serif;
      font-size: 38px;
      font-weight: 500;
      line-height: 0.7;
      letter-spacing: -0.065em;

      cursor: pointer;

      transition:
        opacity 0.3s ease,
        transform 0.3s ease;
    }

    .logo-button:hover {
      opacity: 0.6;
      transform: translateY(-1px);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;

      max-width: 0;
      overflow: hidden;

      opacity: 0;
      transform: translateX(-15px);

      pointer-events: none;
      white-space: nowrap;

      transition:
        max-width 0.55s cubic-bezier(0.2, 0.7, 0.2, 1),
        opacity 0.35s ease,
        transform 0.55s cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    .nav.open .nav-links {
      max-width: 600px;

      opacity: 1;
      transform: translateX(0);

      pointer-events: auto;
    }

    .nav-link {
      position: relative;

      color: var(--white);

      font-size: 11px;
      font-weight: 500;

      text-transform: uppercase;
      letter-spacing: 0.19em;

      transition: opacity 0.25s ease;
    }

    .nav-link::after {
      content: "";

      position: absolute;
      right: 0;
      bottom: -7px;
      left: 0;

      height: 1px;

      background: currentColor;

      transform: scaleX(0);
      transform-origin: right;

      transition: transform 0.3s ease;
    }

    .nav-link:hover {
      opacity: 0.6;
    }

    .nav-link:hover::after {
      transform: scaleX(1);
      transform-origin: left;
    }


    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      min-height: 100vh;

      padding-top: 190px;
      padding-bottom: 110px;
    }

    .hero-intro {
      display: flex;
      justify-content: center;

      margin-bottom: 38px;

      text-align: center;
    }

    .hero-roles {
      color: var(--muted);

      font-size: 10px;
      font-weight: 400;

      text-transform: uppercase;
      letter-spacing: 0.27em;
    }

    .hero-title {
      margin: 0;

      color: var(--white);

      font-family: "Cormorant Garamond", serif;
      font-size: clamp(62px, 12vw, 185px);
      font-weight: 500;
      line-height: 0.82;

      letter-spacing: -0.065em;
      text-align: center;

      white-space: nowrap;
    }

    .hero-image {
      position: relative;

      display: block;

      width: min(720px, 76vw);

      margin: 95px auto 0;

      overflow: hidden;

      border: 1px solid var(--line);
      background: var(--soft-black);

      cursor: zoom-in;
    }

    .hero-image img {
      aspect-ratio: 4 / 5;

      object-fit: cover;

      filter:
        saturate(0.78)
        contrast(1.05);

      transition:
        transform 1.2s cubic-bezier(0.2, 0.7, 0.2, 1),
        filter 0.8s ease;
    }

    .hero-image:hover img {
      transform: scale(1.025);

      filter:
        saturate(0.92)
        contrast(1.05);
    }

    .hero-image-label {
      position: absolute;
      right: 18px;
      bottom: 18px;

      color: rgba(238, 234, 228, 0.6);

      font-size: 8px;

      text-transform: uppercase;
      letter-spacing: 0.25em;

      writing-mode: vertical-rl;
    }


    /* =========================================================
       WORK / GALLERY
    ========================================================= */

    .section {
      padding: 130px 0;
    }

    .section-label {
      margin-bottom: 65px;

      color: var(--muted);

      font-size: 9px;
      font-weight: 400;

      text-transform: uppercase;
      letter-spacing: 0.28em;
    }

    .gallery {
      display: grid;

      grid-template-columns: 1.35fr 0.65fr;
      gap: 24px;

      align-items: start;
    }

    .gallery-column {
      display: grid;
      gap: 24px;
    }

    .gallery-column:nth-child(2) {
      padding-top: 180px;
    }

    .gallery-item {
      position: relative;

      overflow: hidden;

      border: 1px solid var(--line);
      background: var(--soft-black);

      cursor: zoom-in;
    }

    .gallery-item img {
      transition:
        transform 0.9s cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    .gallery-item:hover img {
      transform: scale(1.035);
    }


    /* =========================================================
       CONTACT
    ========================================================= */

    .contact {
      padding: 110px 0 125px;
    }

    .contact-list {
      display: flex;
      flex-direction: column;
      align-items: flex-start;

      gap: 8px;
    }

    .contact-link {
      display: inline-block;

      padding-bottom: 5px;

      border-bottom: 1px solid var(--white);

      font-family: "Cormorant Garamond", serif;
      font-size: clamp(28px, 3.2vw, 44px);
      font-weight: 400;
      line-height: 1;

      letter-spacing: -0.025em;

      transition:
        opacity 0.3s ease,
        transform 0.3s ease;
    }

    .contact-link:hover {
      opacity: 0.55;
      transform: translateX(6px);
    }


    /* =========================================================
       FOOTER
    ========================================================= */

    footer {
      padding: 28px 0 40px;

      border-top: 1px solid var(--line);

      color: var(--muted);

      font-size: 7px;

      text-transform: uppercase;
      letter-spacing: 0.22em;
    }


    /* =========================================================
       LIGHTBOX
    ========================================================= */

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px;

      background: rgba(0, 0, 0, 0.97);

      opacity: 0;
      visibility: hidden;

      transition:
        opacity 0.35s ease,
        visibility 0.35s ease;
    }

    .lightbox.open {
      opacity: 1;
      visibility: visible;
    }

    .lightbox img {
      width: auto;

      max-width: 92vw;
      max-height: 90vh;

      object-fit: contain;
    }

    .lightbox-close {
      position: absolute;
      top: 24px;
      right: 30px;

      border-bottom: 1px solid white;

      color: white;

      font-size: 30px;
      font-weight: 300;

      cursor: pointer;
    }


    /* =========================================================
       SCROLL REVEAL
    ========================================================= */

    .reveal {
      opacity: 0;
      transform: translateY(35px);

      transition:
        opacity 0.9s ease,
        transform 0.9s cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 700px) {
      :root {
        --padding: 18px;
      }

      /* Navigation */

      .nav {
        padding: 26px 0;
      }

      .nav-left {
        gap: 25px;
      }

      .logo-button {
        font-size: 37px;
      }

      .nav-links {
        gap: 22px;
      }

      .nav-link {
        font-size: 10px;
        letter-spacing: 0.15em;
      }

      /* Hero */

      .hero {
        min-height: auto;

        padding-top: 150px;
        padding-bottom: 90px;
      }

      .hero-intro {
        margin-bottom: 30px;
      }

      .hero-roles {
        font-size: 8px;
        letter-spacing: 0.2em;
      }

      .hero-title {
        font-size: 17.5vw;
        line-height: 0.85;
      }

      .hero-image {
        width: 100%;
        margin-top: 65px;
      }

      .hero-image-label {
        display: none;
      }

      /* Work */

      .section {
        padding: 90px 0;
      }

      .section-label {
        margin-bottom: 45px;
      }

      .gallery {
        grid-template-columns: 1fr;
      }

      .gallery-column:nth-child(2) {
        padding-top: 0;
      }

      /* Contact */

      .contact {
        padding: 80px 0 100px;
      }

      .contact-link {
        font-size: 32px;
      }

      /* Lightbox */

      .lightbox {
        padding: 20px;
      }

      .lightbox-close {
        top: 20px;
        right: 22px;
      }
    }


    /* =========================================================
       VERY SMALL PHONES
    ========================================================= */

    @media (max-width: 380px) {
      .nav-left {
        gap: 18px;
      }

      .nav-links {
        gap: 16px;
      }

      .nav-link {
        font-size: 8px;
      }

      .hero-title {
        font-size: 16.5vw;
      }
    }


    /* =========================================================
       REDUCED MOTION
    ========================================================= */

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before {
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <!-- =======================================================
       NAVIGATION
  ======================================================= -->

  <nav
    class="nav"
    id="nav"
    aria-label="Site navigation"
  >
    <div class="wrap nav-inner">

      <div class="nav-left">

        <button
          class="logo-button"
          id="menuButton"
          type="button"
          aria-label="Open navigation"
          aria-expanded="false"
          aria-controls="navigationLinks"
        >
          DZ
        </button>

        <div
          class="nav-links"
          id="navigationLinks"
        >
          <a class="nav-link" href="#home">
            Home
          </a>

          <a class="nav-link" href="#work">
            Work
          </a>

          <a class="nav-link" href="#contact">
            Contact
          </a>
        </div>

      </div>

    </div>
  </nav>


  <!-- =======================================================
       HERO
  ======================================================= -->

  <header
    class="hero"
    id="home"
  >
    <div class="wrap">

      <div class="hero-intro reveal">
        <div class="hero-roles">
          Model, Blogger
        </div>
      </div>

      <h1 class="hero-title reveal">
        Daniil Zorin
      </h1>

      <button
        class="hero-image reveal"
        type="button"
        data-image="Facetune_15-06-2026-23-14-00.jpeg"
        aria-label="Open portrait"
      >
        <img
          src="Facetune_15-06-2026-23-14-00.jpeg"
          alt="Portrait of Daniil Zorin"
        >

        <span class="hero-image-label">
          Portrait / 001
        </span>
      </button>

    </div>
  </header>


  <!-- =======================================================
       MAIN
  ======================================================= -->

  <main>

    <!-- Work -->

    <section
      class="section"
      id="work"
    >
      <div class="wrap">

        <div class="section-label reveal">
          01 / Work
        </div>

        <div class="gallery">

          <div class="gallery-column">

            <button
              class="gallery-item reveal"
              type="button"
              data-image="portfolio-01.jpg"
              aria-label="Open portfolio image"
            >
              <img
                src="portfolio-01.jpg"
                alt="Portfolio image"
                loading="lazy"
              >
            </button>

            <button
              class="gallery-item reveal"
              type="button"
              data-image="portfolio-03.jpg"
              aria-label="Open portfolio image"
            >
              <img
                src="portfolio-03.jpg"
                alt="Portfolio image"
                loading="lazy"
              >
            </button>

          </div>


          <div class="gallery-column">

            <button
              class="gallery-item reveal"
              type="button"
              data-image="portfolio-02.jpg"
              aria-label="Open portfolio image"
            >
              <img
                src="portfolio-02.jpg"
                alt="Portfolio image"
                loading="lazy"
              >
            </button>

            <button
              class="gallery-item reveal"
              type="button"
              data-image="portfolio-04.jpg"
              aria-label="Open portfolio image"
            >
              <img
                src="portfolio-04.jpg"
                alt="Portfolio image"
                loading="lazy"
              >
            </button>

          </div>

        </div>

      </div>
    </section>


    <!-- Contact -->

    <section
      class="contact"
      id="contact"
    >
      <div class="wrap">

        <div class="section-label reveal">
          02 / Contact
        </div>

        <div class="contact-list">

          <a
            class="contact-link reveal"
            href="https://www.instagram.com/zirochkatorrent"
            target="_blank"
            rel="noopener noreferrer"
          >
            Instagram
          </a>

          <a
            class="contact-link reveal"
            href="mailto:zirochkatorrent@icloud.com"
          >
            Email
          </a>

        </div>

      </div>
    </section>

  </main>


  <!-- =======================================================
       FOOTER
  ======================================================= -->

  <footer>
    <div class="wrap">
      © 2026 Daniil Zorin
    </div>
  </footer>


  <!-- =======================================================
       LIGHTBOX
  ======================================================= -->

  <div
    class="lightbox"
    id="lightbox"
    aria-hidden="true"
    role="dialog"
    aria-modal="true"
    aria-label="Image preview"
  >
    <button
      class="lightbox-close"
      id="lightboxClose"
      type="button"
      aria-label="Close image"
    >
      ×
    </button>

    <img
      id="lightboxImage"
      src=""
      alt=""
    >
  </div>


  <!-- =======================================================
       JAVASCRIPT
  ======================================================= -->

  <script>
    /* =======================================================
       NAVIGATION
    ======================================================= */

    const nav = document.getElementById("nav");
    const menuButton = document.getElementById("menuButton");
    const navLinks = document.querySelectorAll(".nav-link");

    function setNavigation(open) {
      nav.classList.toggle("open", open);

      menuButton.setAttribute(
        "aria-expanded",
        String(open)
      );

      menuButton.setAttribute(
        "aria-label",
        open
          ? "Close navigation"
          : "Open navigation"
      );
    }

    menuButton.addEventListener("click", () => {
      const isOpen = nav.classList.contains("open");

      setNavigation(!isOpen);
    });

    navLinks.forEach((link) => {
      link.addEventListener("click", () => {
        setNavigation(false);
      });
    });


    /* =======================================================
       SCROLL REVEAL
    ======================================================= */

    const revealElements =
      document.querySelectorAll(".reveal");

    const revealObserver =
      new IntersectionObserver(
        (entries, observer) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) {
              return;
            }

            entry.target.classList.add("visible");

            observer.unobserve(entry.target);
          });
        },
        {
          threshold: 0.12
        }
      );

    revealElements.forEach((element) => {
      revealObserver.observe(element);
    });


    /* =======================================================
       LIGHTBOX
    ======================================================= */

    const lightbox =
      document.getElementById("lightbox");

    const lightboxImage =
      document.getElementById("lightboxImage");

    const lightboxClose =
      document.getElementById("lightboxClose");

    const clickableImages =
      document.querySelectorAll("[data-image]");

    let lastFocusedElement = null;

    function openLightbox(image, alt = "") {
      lastFocusedElement = document.activeElement;

      lightboxImage.src = image;
      lightboxImage.alt = alt;

      lightbox.classList.add("open");

      lightbox.setAttribute(
        "aria-hidden",
        "false"
      );

      document.body.classList.add("no-scroll");

      lightboxClose.focus();
    }

    function closeLightbox() {
      lightbox.classList.remove("open");

      lightbox.setAttribute(
        "aria-hidden",
        "true"
      );

      document.body.classList.remove("no-scroll");

      setTimeout(() => {
        lightboxImage.src = "";
        lightboxImage.alt = "";
      }, 350);

      if (lastFocusedElement) {
        lastFocusedElement.focus();
      }
    }

    clickableImages.forEach((element) => {
      element.addEventListener("click", () => {
        const image = element.dataset.image;
        const img = element.querySelector("img");

        openLightbox(
          image,
          img?.alt || ""
        );
      });
    });

    lightboxClose.addEventListener(
      "click",
      closeLightbox
    );

    lightbox.addEventListener("click", (event) => {
      if (event.target === lightbox) {
        closeLightbox();
      }
    });


    /* =======================================================
       ESCAPE KEY
    ======================================================= */

    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") {
        return;
      }

      if (lightbox.classList.contains("open")) {
        closeLightbox();
      }

      if (nav.classList.contains("open")) {
        setNavigation(false);
      }
    });
  </script>

</body>
</html>
