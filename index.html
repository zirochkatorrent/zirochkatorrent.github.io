<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Daniil Zorin — model and blogger."
  >

  <meta
    name="robots"
    content="index, follow"
  >

  <meta
    name="theme-color"
    content="#050505"
  >

  <title>Daniil Zorin — Model & Blogger</title>

  <!-- =====================================================
       FONTS
  ====================================================== -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =====================================================
       VARIABLES
    ====================================================== */

    :root {
      --black: #050505;
      --soft-black: #090909;
      --white: #eeeae4;
      --muted: #77736e;
      --line: #242220;

      --max-width: 1280px;
      --padding: 42px;

      --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    }


    /* =====================================================
       RESET
    ====================================================== */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      overflow-x: hidden;

      background: var(--black);
      color: var(--white);

      font-family: "Inter", sans-serif;
      font-weight: 300;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body.no-scroll {
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      margin: 0;
      padding: 0;

      border: 0;
      background: transparent;

      color: inherit;
      font: inherit;
    }

    img {
      display: block;
      max-width: 100%;
    }

    ::selection {
      background: var(--white);
      color: var(--black);
    }

    :focus-visible {
      outline: 1px solid var(--white);
      outline-offset: 6px;
    }


    /* =====================================================
       GRAIN
    ====================================================== */

    body::after {
      content: "";

      position: fixed;
      inset: 0;
      z-index: 9999;

      pointer-events: none;

      opacity: 0.035;
      mix-blend-mode: screen;

      background-image: url(
        "data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E"
      );
    }


    /* =====================================================
       GLOBAL
    ====================================================== */

    .wrap {
      width: min(
        var(--max-width),
        calc(100% - var(--padding) * 2)
      );

      margin-inline: auto;
    }

    section {
      border-top: 1px solid var(--line);
    }


    /* =====================================================
       NAVIGATION
    ====================================================== */

    .nav {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;

      z-index: 100;

      padding: 30px 0;

      mix-blend-mode: difference;
    }

    .nav-inner {
      display: flex;
      align-items: center;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 30px;
    }


    /* DZ */

    .logo-button {
      position: relative;

      display: block;

      color: var(--white);

      font-family: "Cormorant Garamond", serif;
      font-size: 38px;
      font-weight: 500;
      line-height: 0.7;

      letter-spacing: -0.065em;

      cursor: pointer;

      transition:
        opacity 0.3s ease,
        transform 0.45s var(--ease);
    }

    /* Единственное подчёркивание DZ */

    .logo-button::after {
      content: "";

      position: absolute;

      right: 0;
      bottom: -10px;
      left: 0;

      height: 1px;

      background: currentColor;

      transform-origin: left;

      transition:
        transform 0.45s var(--ease);
    }

    .logo-button:hover {
      opacity: 0.65;
      transform: translateY(-2px);
    }

    .logo-button:hover::after {
      transform: scaleX(0.35);
    }


    /* MENU */

    .nav-links {
      display: flex;
      align-items: center;
      gap: 30px;

      max-width: 0;

      overflow: hidden;

      opacity: 0;

      transform: translateX(-20px);

      pointer-events: none;

      white-space: nowrap;

      transition:
        max-width 0.65s var(--ease),
        opacity 0.4s ease,
        transform 0.65s var(--ease);
    }

    .nav.open .nav-links {
      max-width: 700px;

      opacity: 1;

      transform: translateX(0);

      pointer-events: auto;
    }

    /*
      У навигации больше НЕТ underline.
      Только текст.
    */

    .nav-link {
      color: var(--white);

      font-size: 10px;
      font-weight: 500;

      text-transform: uppercase;

      letter-spacing: 0.19em;

      opacity: 0;

      transform: translateY(8px);

      transition:
        opacity 0.4s ease,
        transform 0.5s var(--ease);
    }

    .nav.open .nav-link {
      opacity: 1;
      transform: translateY(0);
    }

    .nav.open .nav-link:nth-child(1) {
      transition-delay: 0.08s;
    }

    .nav.open .nav-link:nth-child(2) {
      transition-delay: 0.14s;
    }

    .nav.open .nav-link:nth-child(3) {
      transition-delay: 0.20s;
    }

    .nav.open .nav-link:nth-child(4) {
      transition-delay: 0.26s;
    }

    .nav-link:hover {
      opacity: 0.55;
    }


    /* =====================================================
       HERO
    ====================================================== */

    .hero {
      min-height: 100svh;

      display: flex;
      align-items: center;

      padding-top: 150px;
      padding-bottom: 110px;
    }

    .hero-content {
      width: 100%;
    }


    /* BIGGER NAME */

    .hero-title {
      width: 100%;

      margin: 0;

      color: var(--white);

      font-family: "Cormorant Garamond", serif;

      /*
        Имя стало заметно больше.
        Максимальный размер увеличен с 235px до 290px.
      */

      font-size: clamp(
        100px,
        18vw,
        290px
      );

      font-weight: 500;

      line-height: 0.78;

      letter-spacing: -0.08em;

      text-align: center;

      white-space: nowrap;

      animation:
        titleReveal 1.4s var(--ease) both;
    }

    @keyframes titleReveal {

      from {
        opacity: 0;

        transform:
          translateY(50px)
          scale(0.96);
      }

      to {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }

    }


    /* =====================================================
       ROLES
    ====================================================== */

    .hero-intro {
      display: flex;
      justify-content: center;

      margin-top: 34px;

      text-align: center;

      animation:
        rolesReveal 1s 0.35s var(--ease) both;
    }

    .hero-roles {
      display: inline-block;

      color: var(--muted);

      font-size: 15px;
      font-weight: 400;

      text-transform: uppercase;

      letter-spacing: 0.28em;

      /*
        Никакого underline.
      */
    }

    @keyframes rolesReveal {

      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }


    /* =====================================================
       HERO IMAGE
    ====================================================== */

    .hero-image {
      position: relative;

      display: block;

      width: min(720px, 76vw);

      margin: 90px auto 0;

      overflow: hidden;

      border: 1px solid var(--line);

      background: var(--soft-black);

      cursor: zoom-in;

      animation:
        imageReveal 1.4s 0.55s var(--ease) both;

      transition:
        transform 0.5s var(--ease);
    }

    .hero-image::before {
      content: "";

      position: absolute;
      inset: 0;

      z-index: 2;

      pointer-events: none;

      background:
        linear-gradient(
          115deg,
          transparent 35%,
          rgba(255, 255, 255, 0.08) 50%,
          transparent 65%
        );

      transform: translateX(-120%);

      transition:
        transform 1.2s var(--ease);
    }

    .hero-image:hover::before {
      transform: translateX(120%);
    }

    .hero-image img {
      width: 100%;

      aspect-ratio: 4 / 5;

      object-fit: cover;

      filter:
        saturate(0.78)
        contrast(1.05);

      transform: scale(1.025);

      transition:
        transform 1.3s var(--ease),
        filter 0.8s ease;
    }

    .hero-image:hover img {
      transform: scale(1.075);

      filter:
        saturate(0.94)
        contrast(1.05);
    }

    .hero-image-label {
      position: absolute;

      right: 18px;
      bottom: 18px;

      z-index: 3;

      color: rgba(
        238,
        234,
        228,
        0.65
      );

      font-size: 8px;

      text-transform: uppercase;

      letter-spacing: 0.25em;

      writing-mode: vertical-rl;
    }

    @keyframes imageReveal {

      from {
        opacity: 0;

        clip-path:
          inset(12% 0 12% 0);

        transform:
          translateY(50px);
      }

      to {
        opacity: 1;

        clip-path:
          inset(0 0 0 0);

        transform:
          translateY(0);
      }

    }


    /* =====================================================
       SECTION HEADERS
    ====================================================== */

    .section-header,
    .work-header {
      display: flex;

      justify-content: space-between;
      align-items: baseline;

      margin-bottom: 55px;
    }

    .section-number {
      color: var(--muted);

      font-size: 9px;
      font-weight: 400;

      text-transform: uppercase;

      letter-spacing: 0.28em;
    }

    .section-title,
    .work-title {
      margin: 0;

      font-family: "Cormorant Garamond", serif;

      font-size: clamp(
        55px,
        7vw,
        100px
      );

      font-weight: 400;

      line-height: 0.9;

      letter-spacing: -0.05em;
    }


    /* =====================================================
       ABOUT
    ====================================================== */

    .about {
      padding: 130px 0;
    }


    /*
      Нормальное поле для текста.

      Теперь это не просто пустая полоса.
      Можно спокойно вставлять сюда обычный текст,
      несколько абзацев или описание.
    */

    .about-content {
      width: 100%;

      min-height: 260px;

      padding: 40px 0;

      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);

      color: var(--muted);

      font-size: clamp(
        18px,
        2vw,
        25px
      );

      line-height: 1.65;

      letter-spacing: -0.01em;
    }

    .about-content p {
      width: min(
        760px,
        100%
      );

      margin: 0;
    }


    /* =====================================================
       SELECTED WORK
    ====================================================== */

    .work {
      padding: 130px 0;
    }


    /*
      Нормальное поле под описание Selected Work.
    */

    .work-empty {
      width: 100%;

      min-height: 200px;

      margin-bottom: 70px;

      padding: 40px 0;

      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);

      color: var(--muted);

      font-size: clamp(
        18px,
        2vw,
        25px
      );

      line-height: 1.65;
    }

    .work-empty p {
      width: min(
        760px,
        100%
      );

      margin: 0;
    }


    /* =====================================================
       GALLERY
    ====================================================== */

    .gallery {
      display: grid;

      grid-template-columns:
        1.35fr
        0.65fr;

      gap: 24px;

      align-items: start;
    }

    .gallery-column {
      display: grid;

      gap: 24px;
    }

    .gallery-column:nth-child(2) {
      padding-top: 180px;
    }

    .gallery-item {
      position: relative;

      display: block;

      width: 100%;

      overflow: hidden;

      border: 1px solid var(--line);

      background: var(--soft-black);

      cursor: zoom-in;
    }

    .gallery-item::after {
      content: "";

      position: absolute;

      inset: 0;

      border: 1px solid transparent;

      pointer-events: none;

      transition:
        border-color 0.4s ease;
    }

    .gallery-item:hover::after {
      border-color:
        rgba(
          238,
          234,
          228,
          0.3
        );
    }

    .gallery-item img {
      width: 100%;

      transition:
        transform 1s var(--ease),
        filter 0.7s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.045);

      filter:
        brightness(1.08)
        saturate(0.9);
    }


    /* =====================================================
       CONTACT
    ====================================================== */

    .contact {
      padding: 120px 0 130px;
    }

    .contact-title {
      margin: 35px 0 65px;

      font-family: "Cormorant Garamond", serif;

      font-size: clamp(
        60px,
        8vw,
        110px
      );

      font-weight: 400;

      line-height: 0.9;

      letter-spacing: -0.05em;
    }

    .contact-list {
      display: flex;

      flex-direction: column;

      align-items: flex-start;

      gap: 16px;
    }

    .contact-link {
      position: relative;

      display: inline-block;

      padding-bottom: 7px;

      font-family: "Cormorant Garamond", serif;

      font-size: clamp(
        32px,
        4vw,
        52px
      );

      font-weight: 400;

      line-height: 1;

      letter-spacing: -0.025em;

      transition:
        transform 0.45s var(--ease),
        opacity 0.3s ease;
    }

    .contact-link::after {
      content: "";

      position: absolute;

      right: 0;
      bottom: 0;
      left: 0;

      height: 1px;

      background: currentColor;

      transform-origin: right;

      transition:
        transform 0.45s var(--ease);
    }

    .contact-link:hover {
      opacity: 0.6;

      transform:
        translateX(8px);
    }

    .contact-link:hover::after {
      transform:
        scaleX(0.35);

      transform-origin: left;
    }


    /* =====================================================
       FOOTER
    ====================================================== */

    footer {
      padding: 30px 0 40px;

      border-top: 1px solid var(--line);

      color: var(--muted);

      font-size: 7px;

      text-transform: uppercase;

      letter-spacing: 0.22em;
    }


    /* =====================================================
       SCROLL REVEAL
    ====================================================== */

    .reveal {
      opacity: 0;

      transform:
        translateY(45px);

      transition:
        opacity 1s ease,
        transform 1s var(--ease);
    }

    .reveal.visible {
      opacity: 1;

      transform:
        translateY(0);
    }


    /* =====================================================
       LIGHTBOX
    ====================================================== */

    .lightbox {
      position: fixed;

      inset: 0;

      z-index: 1000;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 30px;

      background:
        rgba(
          0,
          0,
          0,
          0.97
        );

      opacity: 0;
      visibility: hidden;

      transition:
        opacity 0.4s ease,
        visibility 0.4s ease;
    }

    .lightbox.open {
      opacity: 1;
      visibility: visible;
    }

    .lightbox img {
      width: auto;

      max-width: 92vw;
      max-height: 90vh;

      object-fit: contain;

      transform:
        scale(0.92);

      transition:
        transform 0.7s var(--ease);
    }

    .lightbox.open img {
      transform:
        scale(1);
    }

    .lightbox-close {
      position: absolute;

      top: 24px;
      right: 30px;

      padding-bottom: 5px;

      color: white;

      font-size: 30px;
      font-weight: 300;

      cursor: pointer;

      transition:
        opacity 0.3s ease,
        transform 0.4s var(--ease);
    }

    .lightbox-close:hover {
      opacity: 0.6;

      transform:
        rotate(90deg);
    }


    /* =====================================================
       MOBILE
    ====================================================== */

    @media (max-width: 700px) {

      :root {
        --padding: 28px;
      }

      .nav {
        padding: 27px 0;
      }

      .nav-left {
        gap: 22px;
      }

      .logo-button {
        font-size: 31px;
      }

      .nav-links {
        gap: 18px;
      }

      .nav-link {
        font-size: 8px;

        letter-spacing: 0.15em;
      }


      /* HERO */

      .hero {
        min-height: 100svh;

        padding-top: 175px;
        padding-bottom: 90px;
      }

      .hero-title {
        /*
          Большое имя, но без горизонтального
          выхода за экран.
        */

        font-size: clamp(
          64px,
          15vw,
          150px
        );

        line-height: 0.84;

        letter-spacing: -0.075em;
      }

      .hero-intro {
        margin-top: 35px;
      }

      .hero-roles {
        font-size: 11px;

        letter-spacing: 0.22em;
      }

      .hero-image {
        width: 100%;

        margin-top: 70px;
      }

      .hero-image-label {
        display: none;
      }


      /* ABOUT */

      .about {
        padding: 90px 0;
      }

      .section-header,
      .work-header {
        display: block;

        margin-bottom: 45px;
      }

      .section-title,
      .work-title {
        margin-top: 25px;
      }

      .section-title {
        font-size: 64px;
      }

      .work-title {
        font-size: 60px;
      }

      .about-content {
        min-height: 220px;

        padding: 30px 0;

        font-size: 18px;

        line-height: 1.55;
      }


      /* WORK */

      .work {
        padding: 90px 0;
      }

      .work-empty {
        min-height: 180px;

        margin-bottom: 50px;

        padding: 30px 0;

        font-size: 18px;

        line-height: 1.55;
      }

      .gallery {
        grid-template-columns: 1fr;
      }

      .gallery-column:nth-child(2) {
        padding-top: 0;
      }


      /* CONTACT */

      .contact {
        padding: 90px 0 100px;
      }

      .contact-title {
        margin-top: 30px;

        margin-bottom: 50px;

        font-size: 68px;
      }

      .contact-link {
        font-size: 36px;
      }


      /* LIGHTBOX */

      .lightbox {
        padding: 20px;
      }

      .lightbox-close {
        top: 20px;
        right: 22px;
      }
    }


    /* =====================================================
       SMALL PHONES
    ====================================================== */

    @media (max-width: 380px) {

      :root {
        --padding: 22px;
      }

      .nav-left {
        gap: 17px;
      }

      .nav-links {
        gap: 13px;
      }

      .nav-link {
        font-size: 7px;
      }

      .logo-button {
        font-size: 27px;
      }

      .hero-title {
        font-size: 14vw;
      }

      .hero-roles {
        font-size: 10px;
      }

      .about-content,
      .work-empty {
        font-size: 17px;
      }
    }


    /* =====================================================
       REDUCED MOTION
    ====================================================== */

    @media (prefers-reduced-motion: reduce) {

      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }

    }

  </style>
</head>


<body>

  <!-- =====================================================
       NAVIGATION
  ====================================================== -->

  <nav
    class="nav"
    id="nav"
    aria-label="Site navigation"
  >

    <div class="wrap nav-inner">

      <div class="nav-left">

        <button
          class="logo-button"
          id="menuButton"
          type="button"
          aria-label="Open navigation"
          aria-expanded="false"
          aria-controls="navigationLinks"
        >
          DZ
        </button>

        <div
          class="nav-links"
          id="navigationLinks"
        >

          <a
            class="nav-link"
            href="#home"
          >
            Home
          </a>

          <a
            class="nav-link"
            href="#about"
          >
            About
          </a>

          <a
            class="nav-link"
            href="#work"
          >
            Selected Work
          </a>

          <a
            class="nav-link"
            href="#contact"
          >
            Contact
          </a>

        </div>

      </div>

    </div>

  </nav>


  <!-- =====================================================
       HERO
  ====================================================== -->

  <header
    class="hero"
    id="home"
  >

    <div class="wrap hero-content">

      <h1 class="hero-title">
        Daniil Zorin
      </h1>

      <div class="hero-intro">

        <div class="hero-roles">
          Model, Blogger
        </div>

      </div>

      <button
        class="hero-image"
        type="button"
        data-image="Facetune_15-06-2026-23-14-00.jpeg"
        aria-label="Open portrait"
      >

        <img
          src="Facetune_15-06-2026-23-14-00.jpeg"
          alt="Portrait of Daniil Zorin"
        >

        <span class="hero-image-label">
          Portrait / 001
        </span>

      </button>

    </div>

  </header>


  <!-- =====================================================
       MAIN
  ====================================================== -->

  <main>


    <!-- ===================================================
         ABOUT
    ==================================================== -->

    <section
      class="about"
      id="about"
    >

      <div class="wrap">

        <div class="section-header reveal">

          <span class="section-number">
            01
          </span>

          <h2 class="section-title">
            About
          </h2>

        </div>


        <!-- TEXT FIELD -->

        <div
          class="about-content reveal"
          aria-label="About"
        >

          <!--
            ВСТАВЬ СЮДА ТЕКСТ ABOUT.

            Например:

            <p>
              Your text goes here.
            </p>
          -->

        </div>

      </div>

    </section>


    <!-- ===================================================
         SELECTED WORK
    ==================================================== -->

    <section
      class="work"
      id="work"
    >

      <div class="wrap">

        <div class="work-header reveal">

          <span class="section-number">
            02
          </span>

          <h2 class="work-title">
            Selected Work
          </h2>

        </div>


        <!-- TEXT FIELD -->

        <div
          class="work-empty reveal"
          aria-label="Selected Work"
        >

          <!--
            ВСТАВЬ СЮДА ОПИСАНИЕ WORK.

            Например:

            <p>
              Selected projects, collaborations

  <!-- =====================================================
       LIGHTBOX
  ====================================================== -->

  <div
    class="lightbox"
    id="lightbox"
    aria-hidden="true"
    role="dialog"
    aria-modal="true"
    aria-label="Image preview"
  >

    <button
      class="lightbox-close"
      id="lightboxClose"
      type="button"
      aria-label="Close image"
    >
      ×
    </button>

    <img
      id="lightboxImage"
      src=""
      alt=""
    >

  </div>


  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script>

    /* =====================================================
       ELEMENTS
    ====================================================== */

    const nav =
      document.getElementById("nav");

    const menuButton =
      document.getElementById("menuButton");

    const navLinks =
      document.querySelectorAll(".nav-link");

    const lightbox =
      document.getElementById("lightbox");

    const lightboxImage =
      document.getElementById("lightboxImage");

    const lightboxClose =
      document.getElementById("lightboxClose");

    const clickableImages =
      document.querySelectorAll(
        "[data-image]"
      );

    const heroImage =
      document.querySelector(".hero-image");

    let lastFocusedElement = null;


    /* =====================================================
       NAVIGATION
    ====================================================== */

    function setNavigation(open) {

      nav.classList.toggle(
        "open",
        open
      );

      menuButton.setAttribute(
        "aria-expanded",
        String(open)
      );

      menuButton.setAttribute(
        "aria-label",
        open
          ? "Close navigation"
          : "Open navigation"
      );

    }


    menuButton.addEventListener(
      "click",
      () => {

        const isOpen =
          nav.classList.contains("open");

        setNavigation(!isOpen);

      }
    );


    navLinks.forEach((link) => {

      link.addEventListener(
        "click",
        () => {

          setNavigation(false);

        }
      );

    });


    /* =====================================================
       SCROLL REVEAL
    ====================================================== */

    const revealElements =
      document.querySelectorAll(".reveal");


    if (
      "IntersectionObserver"
      in window
    ) {

      const revealObserver =
        new IntersectionObserver(
          (entries, observer) => {

            entries.forEach((entry) => {

              if (
                !entry.isIntersecting
              ) {
                return;
              }

              entry.target.classList.add(
                "visible"
              );

              observer.unobserve(
                entry.target
              );

            });

          },
          {
            threshold: 0.12
          }
        );


      revealElements.forEach(
        (element) => {

          revealObserver.observe(
            element
          );

        }
      );

    } else {

      revealElements.forEach(
        (element) => {

          element.classList.add(
            "visible"
          );

        }
      );

    }


    /* =====================================================
       LIGHTBOX
    ====================================================== */

    function openLightbox(
      image,
      alt = ""
    ) {

      lastFocusedElement =
        document.activeElement;

      lightboxImage.src =
        image;

      lightboxImage.alt =
        alt;

      lightbox.classList.add(
        "open"
      );

      lightbox.setAttribute(
        "aria-hidden",
        "false"
      );

      document.body.classList.add(
        "no-scroll"
      );

      lightboxClose.focus();

    }


    function closeLightbox() {

      lightbox.classList.remove(
        "open"
      );

      lightbox.setAttribute(
        "aria-hidden",
        "true"
      );

      document.body.classList.remove(
        "no-scroll"
      );


      setTimeout(() => {

        lightboxImage.removeAttribute(
          "src"
        );

        lightboxImage.alt = "";

      }, 400);


      if (
        lastFocusedElement &&
        typeof lastFocusedElement.focus
          === "function"
      ) {

        lastFocusedElement.focus();

      }

      lastFocusedElement = null;

    }


    clickableImages.forEach(
      (element) => {

        element.addEventListener(
          "click",
          () => {

            const image =
              element.dataset.image;

            const img =
              element.querySelector(
                "img"
              );

            if (!image) {
              return;
            }

            openLightbox(
              image,
              img?.alt ||
                "Portfolio image"
            );

          }
        );

      }
    );


    lightboxClose.addEventListener(
      "click",
      closeLightbox
    );


    lightbox.addEventListener(
      "click",
      (event) => {

        if (
          event.target === lightbox
        ) {

          closeLightbox();

        }

      }
    );


    /* =====================================================
       ESCAPE
    ====================================================== */

    document.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key !== "Escape"
        ) {
          return;
        }

        if (
          lightbox.classList.contains(
            "open"
          )
        ) {

          closeLightbox();

        }

        if (
          nav.classList.contains(
            "open"
          )
        ) {

          setNavigation(false);

        }

      }
    );


    /* =====================================================
       HERO PARALLAX
    ====================================================== */

    if (
      heroImage &&
      window.matchMedia(
        "(pointer: fine)"
      ).matches &&
      !window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches
    ) {

      heroImage.addEventListener(
        "mousemove",
        (event) => {

          const rect =
            heroImage.getBoundingClientRect();

          const x =
            (event.clientX -
              rect.left)
            / rect.width
            - 0.5;

          const y =
            (event.clientY -
              rect.top)
            / rect.height
            - 0.5;

          heroImage.style.transform =
            `translate(
              ${x * 4}px,
              ${y * 4}px
            )`;

        }
      );


      heroImage.addEventListener(
        "mouseleave",
        () => {

          heroImage.style.transform =
            "translate(0, 0)";

        }
      );

    }


    /* =====================================================
       IMAGE ERROR HANDLING
    ====================================================== */

    document
      .querySelectorAll("img")
      .forEach((image) => {

        image.addEventListener(
          "error",
          () => {

            image.style.visibility =
              "hidden";

          }
        );

      });

  </script>
