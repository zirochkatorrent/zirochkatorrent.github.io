<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Daniil Zorin — model, blogger."
  >

  <meta
    name="robots"
    content="index, follow"
  >

  <title>Daniil Zorin</title>


  <!-- =====================================================
       FONTS
  ====================================================== -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >


  <style>

    /* =====================================================
       VARIABLES
    ====================================================== */

    :root {
      --black: #050505;
      --soft-black: #090909;
      --white: #eeeae4;
      --muted: #77736e;
      --line: #242220;

      --max-width: 1280px;
      --padding: 42px;

      --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    }


    /* =====================================================
       RESET
    ====================================================== */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      overflow-x: hidden;

      background: var(--black);
      color: var(--white);

      font-family: "Inter", sans-serif;
      font-weight: 300;
    }

    body.no-scroll {
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      margin: 0;
      padding: 0;

      border: 0;
      background: transparent;

      color: inherit;
      font: inherit;
    }

    img {
      display: block;
      width: 100%;
    }

    ::selection {
      background: var(--white);
      color: var(--black);
    }

    :focus-visible {
      outline: 1px solid var(--white);
      outline-offset: 6px;
    }


    /* =====================================================
       GRAIN
    ====================================================== */

    body::after {
      content: "";

      position: fixed;
      inset: 0;
      z-index: 9999;

      pointer-events: none;

      opacity: 0.035;

      mix-blend-mode: screen;

      background-image: url(
        "data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E"
      );
    }


    /* =====================================================
       GLOBAL
    ====================================================== */

    .wrap {
      width: min(
        var(--max-width),
        calc(100% - var(--padding) * 2)
      );

      margin-inline: auto;
    }

    section {
      border-top: 1px solid var(--line);
    }


    /* =====================================================
       NAVIGATION
    ====================================================== */

    .nav {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;

      z-index: 100;

      padding: 30px 0;

      mix-blend-mode: difference;
    }

    .nav-inner {
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 28px;
    }


    /* DZ */

    .logo-button {
      position: relative;

      display: block;

      color: var(--white);

      font-family: "Cormorant Garamond", serif;
      font-size: 38px;
      font-weight: 500;
      line-height: 0.7;

      letter-spacing: -0.065em;

      cursor: pointer;

      transition:
        transform 0.45s var(--ease),
        opacity 0.3s ease;
    }

    .logo-button::after {
      content: "";

      position: absolute;
      right: 0;
      bottom: -9px;
      left: 0;

      height: 1px;

      background: currentColor;

      transform-origin: right;
      transition: transform 0.45s var(--ease);
    }

    .logo-button:hover {
      transform: translateY(-2px);
      opacity: 0.65;
    }

    .logo-button:hover::after {
      transform: scaleX(0.45);
      transform-origin: left;
    }


    /* MENU */

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;

      max-width: 0;

      overflow: hidden;

      opacity: 0;

      transform: translateX(25px);

      pointer-events: none;

      white-space: nowrap;

      transition:
        max-width 0.65s var(--ease),
        opacity 0.4s ease,
        transform 0.65s var(--ease);
    }

    .nav.open .nav-links {
      max-width: 650px;

      opacity: 1;

      transform: translateX(0);

      pointer-events: auto;
    }

    .nav-link {
      position: relative;

      color: var(--white);

      font-size: 10px;
      font-weight: 500;

      text-transform: uppercase;

      letter-spacing: 0.2em;

      transform: translateY(8px);

      opacity: 0;

      transition:
        opacity 0.4s ease,
        transform 0.5s var(--ease);
    }

    .nav.open .nav-link {
      opacity: 1;
      transform: translateY(0);
    }

    .nav.open .nav-link:nth-child(1) {
      transition-delay: 0.08s;
    }

    .nav.open .nav-link:nth-child(2) {
      transition-delay: 0.14s;
    }

    .nav.open .nav-link:nth-child(3) {
      transition-delay: 0.20s;
    }

    .nav.open .nav-link:nth-child(4) {
      transition-delay: 0.26s;
    }

    .nav-link::after {
      content: "";

      position: absolute;

      right: 0;
      bottom: -7px;
      left: 0;

      height: 1px;

      background: currentColor;

      transform: scaleX(1);

      transform-origin: right;

      transition:
        transform 0.4s var(--ease);
    }

    .nav-link:hover::after {
      transform: scaleX(0.35);
      transform-origin: left;
    }

    .nav-link:hover {
      opacity: 0.55;
    }


    /* =====================================================
       HERO
    ====================================================== */

    .hero {
      min-height: 100vh;

      display: flex;
      align-items: center;

      padding-top: 150px;
      padding-bottom: 110px;
    }

    .hero-content {
      width: 100%;
    }


    /* NAME */

    .hero-title {
      width: 100%;

      margin: 0;

      color: var(--white);

      font-family: "Cormorant Garamond", serif;

      font-size: clamp(
        60px,
        11.5vw,
        175px
      );

      font-weight: 500;

      line-height: 0.85;

      letter-spacing: -0.065em;

      text-align: center;

      white-space: nowrap;

      animation:
        titleReveal 1.4s var(--ease) both;
    }


    @keyframes titleReveal {

      from {
        opacity: 0;

        transform:
          translateY(45px)
          scale(0.97);
      }

      to {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }

    }


    /* ROLES */

    .hero-intro {
      display: flex;
      justify-content: center;

      margin-top: 30px;

      text-align: center;

      animation:
        roleReveal 1.1s 0.35s var(--ease) both;
    }

    .hero-roles {
      position: relative;

      display: inline-block;

      color: var(--muted);

      font-size: 14px;
      font-weight: 400;

      text-transform: uppercase;

      letter-spacing: 0.3em;
    }

    .hero-roles::after {
      content: "";

      position: absolute;

      right: 0;
      bottom: -10px;
      left: 0;

      height: 1px;

      background: var(--muted);

      transform-origin: left;

      animation:
        lineReveal 1s 0.8s var(--ease) both;
    }


    @keyframes roleReveal {

      from {
        opacity: 0;

        transform:
          translateY(20px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);
      }

    }


    @keyframes lineReveal {

      from {
        transform: scaleX(0);
      }

      to {
        transform: scaleX(1);
      }

    }


    /* =====================================================
       HERO IMAGE
    ====================================================== */

    .hero-image {
      position: relative;

      display: block;

      width: min(720px, 76vw);

      margin: 90px auto 0;

      overflow: hidden;

      border: 1px solid var(--line);

      background: var(--soft-black);

      cursor: zoom-in;

      animation:
        imageReveal 1.4s 0.55s var(--ease) both;
    }

    .hero-image::before {
      content: "";

      position: absolute;

      inset: 0;

      z-index: 2;

      pointer-events: none;

      background: linear-gradient(
        120deg,
        transparent 35%,
        rgba(255, 255, 255, 0.08) 50%,
        transparent 65%
      );

      transform: translateX(-120%);

      transition:
        transform 1.2s var(--ease);
    }

    .hero-image:hover::before {
      transform: translateX(120%);
    }

    .hero-image img {
      aspect-ratio: 4 / 5;

      object-fit: cover;

      filter:
        saturate(0.78)
        contrast(1.05);

      transform: scale(1.04);

      transition:
        transform 1.3s var(--ease),
        filter 0.8s ease;
    }

    .hero-image:hover img {
      transform: scale(1.075);

      filter:
        saturate(0.95)
        contrast(1.05);
    }

    .hero-image-label {
      position: absolute;

      right: 18px;
      bottom: 18px;

      z-index: 3;

      color: rgba(
        238,
        234,
        228,
        0.65
      );

      font-size: 8px;

      text-transform: uppercase;

      letter-spacing: 0.25em;

      writing-mode: vertical-rl;
    }


    @keyframes imageReveal {

      from {
        opacity: 0;

        clip-path:
          inset(12% 0 12% 0);

        transform:
          translateY(50px);
      }

      to {
        opacity: 1;

        clip-path:
          inset(0 0 0 0);

        transform:
          translateY(0);
      }

    }


    /* =====================================================
       ABOUT
    ====================================================== */

    .about {
      min-height: 45vh;

      padding: 130px 0;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;

      margin-bottom: 80px;
    }

    .section-number {
      color: var(--muted);

      font-size: 9px;
      font-weight: 400;

      text-transform: uppercase;

      letter-spacing: 0.28em;
    }

    .section-title {
      margin: 0;

      font-family: "Cormorant Garamond", serif;

      font-size: clamp(
        50px,
        7vw,
        95px
      );

      font-weight: 400;

      line-height: 0.9;

      letter-spacing: -0.05em;
    }

    .about-content {
      min-height: 180px;

      border-top: 1px solid var(--line);

      border-bottom: 1px solid var(--line);
    }


    /* =====================================================
       SELECTED WORK
    ====================================================== */

    .work {
      padding: 130px 0;
    }

    .work-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;

      margin-bottom: 70px;
    }

    .work-title {
      margin: 0;

      font-family: "Cormorant Garamond", serif;

      font-size: clamp(
        48px,
        7vw,
        95px
      );

      font-weight: 400;

      line-height: 0.9;

      letter-spacing: -0.05em;
    }

    .work-empty {
      min-height: 80px;

      margin-bottom: 60px;

      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }


    /* =====================================================
       GALLERY
    ====================================================== */

    .gallery {
      display: grid;

      grid-template-columns:
        1.35fr
        0.65fr;

      gap: 24px;

      align-items: start;
    }

    .gallery-column {
      display: grid;

      gap: 24px;
    }

    .gallery-column:nth-child(2) {
      padding-top: 180px;
    }

    .gallery-item {
      position: relative;

      overflow: hidden;

      border: 1px solid var(--line);

      background: var(--soft-black);

      cursor: zoom-in;
    }

    .gallery-item::after {
      content: "";

      position: absolute;

      inset: 0;

      pointer-events: none;

      border: 1px solid transparent;

      transition:
        border-color 0.5s ease;
    }

    .gallery-item:hover::after {
      border-color:
        rgba(238, 234, 228, 0.25);
    }

    .gallery-item img {
      transition:
        transform 1s var(--ease),
        filter 0.7s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.045);

      filter:
        brightness(1.08)
        saturate(0.9);
    }


    /* =====================================================
       CONTACT
    ====================================================== */

    .contact {
      padding: 120px 0 130px;
    }

    .contact-title {
      margin: 0 0 65px;

      font-family: "Cormorant Garamond", serif;

      font-size: clamp(
        55px,
        8vw,
        105px
      );

      font-weight: 400;

      line-height: 0.9;

      letter-spacing: -0.05em;
    }

    .contact-list {
      display: flex;
      flex-direction: column;

      align-items: flex-start;

      gap: 15px;
    }

    .contact-link {
      position: relative;

      display: inline-block;

      padding-bottom: 7px;

      font-family: "Cormorant Garamond", serif;

      font-size: clamp(
        30px,
        4vw,
        50px
      );

      font-weight: 400;

      line-height: 1;

      letter-spacing: -0.025em;
    }

    .contact-link::after {
      content: "";

      position: absolute;

      right: 0;
      bottom: 0;
      left: 0;

      height: 1px;

      background: currentColor;

      transform-origin: right;

      transition:
        transform 0.45s var(--ease);
    }

    .contact-link:hover::after {
      transform:
        scaleX(0.35);

      transform-origin: left;
    }

    .contact-link:hover {
      transform: translateX(8px);

      transition:
        transform 0.45s var(--ease);
    }


    /* =====================================================
       FOOTER
    ====================================================== */

    footer {
      padding: 30px 0 40px;

      border-top: 1px solid var(--line);

      color: var(--muted);

      font-size: 7px;

      text-transform: uppercase;

      letter-spacing: 0.22em;
    }


    /* =====================================================
       LIGHTBOX
    ====================================================== */

    .lightbox {
      position: fixed;
      inset: 0;

      z-index: 1000;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px;

      background:
        rgba(0, 0, 0, 0.97);

      opacity: 0;
      visibility: hidden;

      transition:
        opacity 0.4s ease,
        visibility 0.4s ease;
    }

    .lightbox.open {
      opacity: 1;
      visibility: visible;
    }

    .lightbox img {
      width: auto;

      max-width: 92vw;
      max-height: 90vh;

      object-fit: contain;

      transform: scale(0.94);

      transition:
        transform 0.7s var(--ease);
    }

    .lightbox.open img {
      transform: scale(1);
    }

    .lightbox-close {
      position: absolute;

      top: 24px;
      right: 30px;

      padding-bottom: 5px;

      border-bottom: 1px solid white;

      color: white;

      font-size: 30px;
      font-weight: 300;

      cursor: pointer;

      transition:
        transform 0.3s ease,
        opacity 0.3s ease;
    }

    .lightbox-close:hover {
      opacity: 0.6;

      transform:
        rotate(90deg);
    }


    /* =====================================================
       SCROLL REVEAL
    ====================================================== */

    .reveal {
      opacity: 0;

      transform:
        translateY(40px);

      transition:
        opacity 1s ease,
        transform 1s var(--ease);
    }

    .reveal.visible {
      opacity: 1;

      transform:
        translateY(0);
    }


    /* =====================================================
       MOBILE
    ====================================================== */

    @media (max-width: 700px) {

      :root {
        --padding: 28px;
      }


      /* Navigation */

      .nav {
        padding: 27px 0;
      }

      .nav-right {
        gap: 20px;
      }

      .logo-button {
        font-size: 31px;
      }

      .nav-links {
        gap: 18px;
      }

      .nav-link {
        font-size: 8px;

        letter-spacing:
          0.15em;
      }


      /* Hero */

      .hero {
        min-height: 100vh;

        padding-top: 170px;
        padding-bottom: 90px;
      }

      .hero-title {
        font-size: 12.2vw;

        line-height: 0.9;

        white-space: nowrap;
      }

      .hero-intro {
        margin-top: 34px;
      }

      .hero-roles {
        font-size: 11px;

        letter-spacing:
          0.22em;
      }

      .hero-image {
        width: 100%;

        margin-top: 70px;
      }

      .hero-image-label {
        display: none;
      }


      /* About */

      .about {
        min-height: 50vh;

        padding: 90px 0;
      }

      .section-header {
        margin-bottom: 50px;
      }

      .section-title {
        font-size: 58px;
      }

      .about-content {
        min-height: 150px;
      }


      /* Work */

      .work {
        padding: 90px 0;
      }

      .work-header {
        margin-bottom: 45px;
      }

      .work-title {
        font-size: 58px;
      }

      .work-empty {
        min-height: 70px;

        margin-bottom: 45px;
      }

      .gallery {
        grid-template-columns: 1fr;
      }

      .gallery-column:nth-child(2) {
        padding-top: 0;
      }


      /* Contact */

      .contact {
        padding: 90px 0 100px;
      }

      .contact-title {
        margin-bottom: 50px;

        font-size: 62px;
      }

      .contact-link {
        font-size: 34px;
      }


      /* Lightbox */

      .lightbox {
        padding: 20px;
      }

      .lightbox-close {
        top: 20px;
        right: 22px;
      }

    }


    /* =====================================================
       SMALL PHONES
    ====================================================== */

    @media (max-width: 380px) {

      :root {
        --padding: 22px;
      }

      .nav-right {
        gap: 15px;
      }

      .nav-links {
        gap: 13px;
      }

      .nav-link {
        font-size: 7px;
      }

      .logo-button {
        font-size: 27px;
      }

      .hero-title {
        font-size: 11.7vw;
      }

      .hero-roles {
        font-size: 10px;
      }

    }


    /* =====================================================
       REDUCED MOTION
    ====================================================== */

    @media (prefers-reduced-motion: reduce) {

      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }

    }

  </style>
</head>


<body>


  <!-- =====================================================
       NAVIGATION
  ====================================================== -->

  <nav
    class="nav"
    id="nav"
    aria-label="Site navigation"
  >

    <div class="wrap nav-inner">

      <div class="nav-right">

        <!-- MENU LINKS -->

        <div
          class="nav-links"
          id="navigationLinks"
        >

          <a
            class="nav-link"
            href="#home"
          >
            Home
          </a>

          <a
            class="nav-link"
            href="#about"
          >
            About
          </a>

          <a
            class="nav-link"
            href="#work"
          >
            Selected Work
          </a>

          <a
            class="nav-link"
            href="#contact"
          >
            Contact
          </a>

        </div>


        <!-- DZ -->

        <button
          class="logo-button"
          id="menuButton"
          type="button"
          aria-label="Open navigation"
          aria-expanded="false"
          aria-controls="navigationLinks"
        >
          DZ
        </button>

      </div>

    </div>

  </nav>


  <!-- =====================================================
       HERO
  ====================================================== -->

  <header
    class="hero"
    id="home"
  >

    <div class="wrap hero-content">

      <!-- NAME -->

      <h1 class="hero-title">
        Daniil Zorin
      </h1>


      <!-- ROLES -->

      <div class="hero-intro">

        <div class="hero-roles">
          Model, Blogger
        </div>

      </div>


      <!-- PORTRAIT -->

      <button
        class="hero-image"
        type="button"
        data-image="Facetune_15-06-2026-23-14-00.jpeg"
        aria-label="Open portrait"
      >

        <img
          src="Facetune_15-06-2026-23-14-00.jpeg"
          alt="Portrait"
        >

        <span class="hero-image-label">
          Portrait / 001
        </span>

      </button>

    </div>

  </header>


  <!-- =====================================================
       MAIN
  ====================================================== -->

  <main>


    <!-- ===================================================
         ABOUT
    ==================================================== -->

    <section
      class="about"
      id="about"
    >

      <div class="wrap">

        <div class="section-header reveal">

          <span class="section-number">
            01 / About
          </span>

          <h2 class="section-title">
            About
          </h2>

        </div>


        <!-- EMPTY FIELD -->

        <div
          class="about-content reveal"
          aria-label="About"
        ></div>

      </div>

    </section>


    <!-- ===================================================
         SELECTED WORK
    ==================================================== -->

    <section
      class="work"
      id="work"
    >

      <div class="wrap">

        <div class="work-header reveal">

          <span class="section-number">
            02 / Selected Work
          </span>

          <h2 class="work-title">
            Selected Work
          </h2>

        </div>


        <!-- EMPTY FIELD -->

        <div
          class="work-empty reveal"
          aria-label="Selected work"
        ></div>


        <!-- GALLERY -->

        <div class="gallery">


          <!-- COLUMN 1 -->

          <div class="gallery-column">

            <button
              class="gallery-item reveal"
              type="button"
              data-image="portfolio-01.jpg"
              aria-label="Open portfolio image"
            >

              <img
                src="portfolio-01.jpg"
                alt="Portfolio image"
                loading="lazy"
              >

            </button>


            <button
              class="gallery-item reveal"
              type="button"
              data-image="portfolio-03.jpg"
              aria-label="Open portfolio image"
            >

              <img
                src="portfolio-03.jpg"
                alt="Portfolio image"
                loading="lazy"
              >

            </button>

          </div>


          <!-- COLUMN 2 -->

          <div class="gallery-column">

            <button
              class="gallery-item reveal"
              type="button"
              data-image="portfolio-02.jpg"
              aria-label="Open portfolio image"
            >

              <img
                src="portfolio-02.jpg"
                alt="Portfolio image"
                loading="lazy"
              >

            </button>


            <button
              class="gallery-item reveal"
              type="button"
              data-image="portfolio-04.jpg"
              aria-label="Open portfolio image"
            >

              <img
                src="portfolio-04.jpg"

      © 2026

  <!-- =====================================================
       LIGHTBOX
  ====================================================== -->

  <div
    class="lightbox"
    id="lightbox"
    aria-hidden="true"
    role="dialog"
    aria-modal="true"
    aria-label="Image preview"
  >

    <button
      class="lightbox-close"
      id="lightboxClose"
      type="button"
      aria-label="Close image"
    >
      ×
    </button>


    <img
      id="lightboxImage"
      src=""
      alt=""
    >

  </div>


  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script>

    /* =====================================================
       NAVIGATION
    ====================================================== */

    const nav =
      document.getElementById("nav");

    const menuButton =
      document.getElementById("menuButton");

    const navLinks =
      document.querySelectorAll(".nav-link");


    function setNavigation(open) {

      nav.classList.toggle(
        "open",
        open
      );

      menuButton.setAttribute(
        "aria-expanded",
        String(open)
      );

      menuButton.setAttribute(
        "aria-label",
        open
          ? "Close navigation"
          : "Open navigation"
      );

    }


    menuButton.addEventListener(
      "click",
      () => {

        const isOpen =
          nav.classList.contains("open");

        setNavigation(!isOpen);

      }
    );


    navLinks.forEach((link) => {

      link.addEventListener(
        "click",
        () => {
          setNavigation(false);
        }
      );

    });


    /* =====================================================
       SCROLL REVEAL
    ====================================================== */

    const revealElements =
      document.querySelectorAll(".reveal");


    const revealObserver =
      new IntersectionObserver(
        (entries, observer) => {

          entries.forEach((entry) => {

            if (!entry.isIntersecting) {
              return;
            }

            entry.target.classList.add(
              "visible"
            );

            observer.unobserve(
              entry.target
            );

          });

        },
        {
          threshold: 0.12
        }
      );


    revealElements.forEach((element) => {

      revealObserver.observe(element);

    });


    /* =====================================================
       LIGHTBOX
    ====================================================== */

    const lightbox =
      document.getElementById("lightbox");

    const lightboxImage =
      document.getElementById(
        "lightboxImage"
      );

    const lightboxClose =
      document.getElementById(
        "lightboxClose"
      );

    const clickableImages =
      document.querySelectorAll(
        "[data-image]"
      );

    let lastFocusedElement = null;


    function openLightbox(
      image,
      alt = ""
    ) {

      lastFocusedElement =
        document.activeElement;

      lightboxImage.src = image;
      lightboxImage.alt = alt;

      lightbox.classList.add(
        "open"
      );

      lightbox.setAttribute(
        "aria-hidden",
        "false"
      );

      document.body.classList.add(
        "no-scroll"
      );

      lightboxClose.focus();

    }


    function closeLightbox() {

      lightbox.classList.remove(
        "open"
      );

      lightbox.setAttribute(
        "aria-hidden",
        "true"
      );

      document.body.classList.remove(
        "no-scroll"
      );

      setTimeout(() => {

        lightboxImage.src = "";
        lightboxImage.alt = "";

      }, 400);


      if (lastFocusedElement) {

        lastFocusedElement.focus();

      }

    }


    clickableImages.forEach((element) => {

      element.addEventListener(
        "click",
        () => {

          const image =
            element.dataset.image;

          const img =
            element.querySelector("img");

          openLightbox(
            image,
            img?.alt || ""
          );

        }
      );

    });


    lightboxClose.addEventListener(
      "click",
      closeLightbox
    );


    lightbox.addEventListener(
      "click",
      (event) => {

        if (
          event.target === lightbox
        ) {
          closeLightbox();
        }

      }
    );


    /* =====================================================
       ESCAPE
    ====================================================== */

    document.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key !== "Escape"
        ) {
          return;
        }


        if (
          lightbox.classList.contains(
            "open"
          )
        ) {
          closeLightbox();
        }


        if (
          nav.classList.contains(
            "open"
          )
        ) {
          setNavigation(false);
        }

      }
    );


    /* =====================================================
       SUBTLE MOUSE PARALLAX
    ====================================================== */

    const heroImage =
      document.querySelector(
        ".hero-image"
      );


    if (
      heroImage &&
      window.matchMedia(
        "(pointer: fine)"
      ).matches
    ) {

      heroImage.addEventListener(
        "mousemove",
        (event) => {

          const rect =
            heroImage.getBoundingClientRect();

          const x =
            (event.clientX - rect.left)
            / rect.width
            - 0.5;

          const y =
            (event.clientY - rect.top)
            / rect.height
            - 0.5;


          heroImage.style.transform =
            `translate(${x * 4}px, ${y * 4}px)`;

        }
      );


      heroImage.addEventListener(
        "mouseleave",
        () => {

          heroImage.style.transform =
            "translate(0, 0)";

        }
      );

    }


    /* =====================================================
       IMAGE LOADING EFFECT
    ====================================================== */

    document
      .querySelectorAll("img")
      .forEach((image) => {

        if (image.complete) {

          image.classList.add(
            "loaded"
          );

        } else {

          image.addEventListener(
            "load",
            () => {

              image.classList.add(
                "loaded"
              );

            }
          );

        }

      });

  </script>

</body>
