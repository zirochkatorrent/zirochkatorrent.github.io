<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Daniil Zorin — модель и блогер. zirochkatorrent.">
  <meta name="keywords" content="Daniil Zorin, zirochkatorrent, модель, блогер">
  <meta name="author" content="Daniil Zorin">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="Daniil Zorin — Model & Blogger">
  <meta property="og:description" content="Daniil Zorin — модель и блогер.">
  <title>Daniil Zorin — Model · Blogger</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap');

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: #080808;
      color: #f4f4f0;
      font-family: Inter, sans-serif;
      font-weight: 300;
      letter-spacing: .02em;
    }
    a { color: inherit; text-decoration: none; }
    .wrap { width: min(1180px, calc(100% - 48px)); margin: auto; }

    header {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 0 34px;
    }
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .16em;
    }
    .mark { font-weight: 600; }
    .handle { opacity: .5; }

    .hero { padding: 8vh 0 7vh; }
    .eyebrow {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .24em;
      opacity: .5;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0;
      font-family: "Playfair Display", serif;
      font-size: clamp(64px, 13vw, 170px);
      line-height: .86;
      font-weight: 500;
      letter-spacing: -.055em;
    }
    .role {
      margin-top: 34px;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: .18em;
    }
    .photo {
      margin-top: 55px;
      height: min(72vh, 760px);
      min-height: 420px;
      border: 1px solid #252525;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 40%, #202020 0, #101010 34%, #090909 70%);
      color: #555;
      text-transform: uppercase;
      letter-spacing: .2em;
      font-size: 11px;
    }

    section { padding: 120px 0; border-top: 1px solid #202020; }
    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .24em;
      opacity: .5;
      margin-bottom: 42px;
    }
    .empty {
      min-height: 180px;
      display: flex;
      align-items: center;
      color: #333;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .15em;
    }
    .socials {
      display: flex;
      flex-direction: column;
      gap: 0;
      max-width: 700px;
    }
    .social {
      padding: 22px 0;
      border-bottom: 1px solid #252525;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 18px;
      transition: opacity .25s, padding-left .25s;
    }
    .social:hover { opacity: .55; padding-left: 8px; }
    .arrow { opacity: .45; }

    footer {
      padding: 34px 0 50px;
      border-top: 1px solid #202020;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .16em;
      opacity: .45;
    }

    @media (max-width: 600px) {
      .wrap { width: min(100% - 32px, 1180px); }
      header { padding-top: 20px; }
      .hero { padding-top: 15vh; }
      .photo { min-height: 55vh; margin-top: 40px; }
      section { padding: 85px 0; }
      footer { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header class="wrap">
    <nav>
      <div class="mark">Daniil Zorin</div>
      <div class="handle">zirochkatorrent</div>
    </nav>

    <main class="hero">
      <div class="eyebrow">Personal website</div>
      <h1>Daniil<br>Zorin</h1>
      <div class="role">Model · Blogger</div>

      <div class="photo" aria-label="Место для фотографии">
        Фото
      </div>
    </main>
  </header>

  <section>
    <div class="wrap">
      <div class="section-title">01 — About</div>
      <div class="empty"></div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <div class="section-title">02 — Portfolio</div>
      <div class="empty"></div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <div class="section-title">03 — Socials</div>
      <div class="socials">
        <a class="social" href="https://www.instagram.com/zirochkatorrent?stkn=MWYwcXhzbGt5ZXhlbA%3D%3D&utm_source=qr" target="_blank" rel="noopener noreferrer">
          <span>Instagram</span><span class="arrow">↗</span>
        </a>
      </div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <div class="section-title">04 — Contact</div>
      <div class="socials">
        <div class="social">
          <span>zirochkatorrent</span>
        </div>
      </div>
    </div>
  </section>

  <footer class="wrap">
    <span>© 2026 Daniil Zorin</span>
    <span>zirochkatorrent</span>
  </footer>
</body>
</html>
