<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta
name=“description”
content=“Daniil Zorin — personal website.”

  <title>Daniil Zorin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap"
    rel="stylesheet"
  >
  <style>
    :root {
      --bg: #050505;
      --text: #f1f1ed;
      --muted: #777;
      --line: #252525;
      --max-width: 1280px;
      --padding: 42px;
    }
    * {
      box-sizing: border-box;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", sans-serif;
      font-weight: 300;
      overflow-x: hidden;
    }
    body.menu-open {
      overflow: hidden;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    button {
      font: inherit;
    }
    img {
      display: block;
      width: 100%;
    }
    ::selection {
      background: var(--text);
      color: var(--bg);
    }
    .wrap {
      width: min(
        var(--max-width),
        calc(100% - var(--padding) * 2)
      );
      margin-inline: auto;
    }
    /* NAVIGATION */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 25px 0;
    }
    .nav-inner {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .logo {
      border: 0;
      padding: 0;
      background: none;
      color: var(--text);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .2em;
      cursor: pointer;
    }
    .menu {
      display: none;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
      margin-top: 2px;
    }
    .menu.open {
      display: flex;
    }
    .menu a {
      padding-bottom: 3px;
      border-bottom: 1px solid var(--text);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .18em;
    }
    /* HERO */
    .hero {
      min-height: 100vh;
      padding-top: 150px;
      padding-bottom: 80px;
    }
    .hero-title {
      margin: 0;
      font-family: "Playfair Display", serif;
      font-size: clamp(80px, 17vw, 220px);
      font-weight: 500;
      line-height: .76;
      letter-spacing: -.07em;
    }
    .hero-role {
      margin-top: 35px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .2em;
      color: #aaa;
    }
    .hero-photo {
      width: min(65vw, 760px);
      margin-top: 70px;
      margin-left: auto;
      overflow: hidden;
      border: 1px solid var(--line);
    }
    .hero-photo img {
      width: 100%;
      height: auto;
    }
    /* SECTIONS */
    section {
      padding: 130px 0;
      border-top: 1px solid var(--line);
    }
    .section-title {
      margin-bottom: 55px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .24em;
      color: var(--muted);
    }
    .section-space {
      min-height: 300px;
    }
    /* ABOUT */
    .about-text {
      max-width: 800px;
      font-family: "Playfair Display", serif;
      font-size: clamp(36px, 5vw, 70px);
      line-height: 1;
      letter-spacing: -.04em;
    }
    /* WORK */
    .gallery {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    .gallery-column {
      display: grid;
      gap: 24px;
    }
    .gallery-column:nth-child(2) {
      padding-top: 120px;
    }
    .gallery-item {
      padding: 0;
      border: 1px solid var(--line);
      background: transparent;
      cursor: pointer;
      overflow: hidden;
    }
    .gallery-item img {
      transition: transform .7s ease;
    }
    .gallery-item:hover img {
      transform: scale(1.02);
    }
    /* LINKS */
    .links {
      max-width: 800px;
    }
    .link {
      display: block;
      width: fit-content;
      margin-bottom: 25px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--text);
      font-size: 20px;
      transition: opacity .25s ease;
    }
    .link:hover {
      opacity: .5;
    }
    /* CONTACT */
    .contact-email {
      font-size: clamp(25px, 4vw, 48px);
    }
    /* FOOTER */
    footer {
      padding: 35px 0 50px;
      border-top: 1px solid var(--line);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .18em;
      color: var(--muted);
    }
    /* LIGHTBOX */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      background: rgba(0, 0, 0, .96);
      opacity: 0;
      visibility: hidden;
      transition:
        opacity .3s ease,
        visibility .3s ease;
    }
    .lightbox.open {
      opacity: 1;
      visibility: visible;
    }
    .lightbox img {
      width: auto;
      max-width: 92vw;
      max-height: 90vh;
      object-fit: contain;
    }
    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 25px;
      padding: 0;
      border: 0;
      background: none;
      color: var(--text);
      font-size: 30px;
      font-weight: 300;
      cursor: pointer;
    }
    /* MOBILE */
    @media (max-width: 700px) {
      :root {
        --padding: 18px;
      }
      .nav {
        padding: 20px 0;
      }
      .hero {
        padding-top: 120px;
      }
      .hero-title {
        font-size: 22vw;
      }
      .hero-photo {
        width: 85vw;
        margin-top: 50px;
      }
      section {
        padding: 90px 0;
      }
      .gallery {
        grid-template-columns: 1fr;
      }
      .gallery-column:nth-child(2) {
        padding-top: 0;
      }
      .section-space {
        min-height: 220px;
      }
      .link {
        font-size: 17px;
      }
    }
  </style>
</head>
<body>
  <!-- NAVIGATION -->
  <nav class="nav">
    <div class="wrap nav-inner">
  <button

  <div class="menu" id="menu">

  </nav>
  <!-- HERO -->

<h1 class="hero-title">

  <main>

<section id="about">

      <div class="gallery-column">

          <img

        <button

<!-- SOCIALS -->
<section id="socials">

      <a

  </main>
  <!-- FOOTER -->
  <footer>
<div class="wrap">
  © 2026 Daniil Zorin
</div>
  </footer>
  <!-- LIGHTBOX -->
  <div
    class="lightbox"
    id="lightbox"
    aria-hidden="true"
  >
<button
  class="lightbox-close"
  id="lightboxClose"
  type="button"
  aria-label="Close"
>
  ×
</button>
<img
  id="lightboxImage"
  src=""
  alt=""
>
  </div>
  <script>
    /* MENU */
    const menuButton =
      document.getElementById("menuButton");
    const menu =
      document.getElementById("menu");
    const menuLinks =
      menu.querySelectorAll("a");
    menuButton.addEventListener("click", () => {
      const isOpen =
        menu.classList.toggle("open");
      menuButton.setAttribute(
        "aria-expanded",
        isOpen
      );
    });
    menuLinks.forEach((link) => {
      link.addEventListener("click", () => {
        menu.classList.remove("open");
        menuButton.setAttribute(
          "aria-expanded",
          "false"
        );
      });
    });
    /* LIGHTBOX */
    const lightbox =
      document.getElementById("lightbox");
    const lightboxImage =
      document.getElementById("lightboxImage");
    const lightboxClose =
      document.getElementById("lightboxClose");
    const galleryItems =
      document.querySelectorAll(".gallery-item");
    function openLightbox(image) {
      lightboxImage.src = image;
      lightbox.classList.add("open");
      lightbox.setAttribute(
        "aria-hidden",
        "false"
      );
      document.body.classList.add(
        "menu-open"
      );
    }
    function closeLightbox() {
      lightbox.classList.remove("open");
      lightbox.setAttribute(
        "aria-hidden",
        "true"
      );
      document.body.classList.remove(
        "menu-open"
      );
    }
    galleryItems.forEach((item) => {
      item.addEventListener("click", () => {
        openLightbox(
          item.dataset.image
        );
      });
    });
    lightboxClose.addEventListener(
      "click",
      closeLightbox
    );
    lightbox.addEventListener(
      "click",
      (event) => {
        if (event.target === lightbox) {
          closeLightbox();
        }
      }
    );
    document.addEventListener(
      "keydown",
      (event) => {
        if (event.key === "Escape") {
          closeLightbox();
        }
      }
    );
  </script>
</body>
</html>
