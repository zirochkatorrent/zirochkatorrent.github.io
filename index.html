<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

<meta
name=“description”
content=“Daniil Zorin — personal website.”

  <meta name="robots" content="index, follow">
  <title>Daniil Zorin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap"
    rel="stylesheet"
  >
  <style>
    :root {
      --black: #050505;
      --white: #f1f1ed;
      --grey: #777;
      --line: #202020;
      --max-width: 1280px;
      --padding: 42px;
    }
    * {
      box-sizing: border-box;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      margin: 0;
      background: var(--black);
      color: var(--white);
      font-family: "Inter", sans-serif;
      font-weight: 300;
      overflow-x: hidden;
    }
    body.no-scroll {
      overflow: hidden;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    button {
      font: inherit;
      color: inherit;
    }
    img {
      display: block;
      width: 100%;
    }
    ::selection {
      background: var(--white);
      color: var(--black);
    }
    /* Grain */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      opacity: 0.04;
      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
      mix-blend-mode: screen;
    }
    /* Layout */
    .wrap {
      width: min(
        var(--max-width),
        calc(100% - var(--padding) * 2)
      );
      margin-inline: auto;
    }
    section {
      position: relative;
      border-top: 1px solid var(--line);
    }
    /* Navigation */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 25px 0;
      mix-blend-mode: difference;
    }
    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo-button {
      padding: 0;
      border: 0;
      border-bottom: 1px solid currentColor;
      background: transparent;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.2em;
      cursor: pointer;
    }
    /* Menu */
    .menu {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--black);
      opacity: 0;
      visibility: hidden;
      transition:
        opacity 0.35s ease,
        visibility 0.35s ease;
    }
    .menu.open {
      opacity: 1;
      visibility: visible;
    }
    .menu-inner {
      width: min(900px, calc(100% - 36px));
    }
    .menu-list {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }
    .menu-link {
      border: 0;
      border-bottom: 1px solid var(--white);
      padding: 4px 0;
      background: transparent;
      font-family: "Playfair Display", serif;
      font-size: clamp(48px, 8vw, 100px);
      line-height: 0.95;
      letter-spacing: -0.045em;
      cursor: pointer;
      transform: translateY(20px);
      opacity: 0;
      transition:
        opacity 0.45s ease,
        transform 0.45s ease,
        color 0.25s ease;
    }
    .menu.open .menu-link {
      transform: translateY(0);
      opacity: 1;
    }
    .menu.open .menu-link:nth-child(1) {
      transition-delay: 0.05s;
    }
    .menu.open .menu-link:nth-child(2) {
      transition-delay: 0.1s;
    }
    .menu.open .menu-link:nth-child(3) {
      transition-delay: 0.15s;
    }
    .menu.open .menu-link:nth-child(4) {
      transition-delay: 0.2s;
    }
    .menu-link:hover {
      color: #888;
    }
    /* Hero */
    .hero {
      min-height: 100vh;
      position: relative;
      padding-top: 150px;
      padding-bottom: 80px;
    }
    .hero-meta {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 35px;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      color: var(--grey);
    }
    .hero-title {
      position: relative;
      z-index: 2;
      margin: 0;
      font-family: "Playfair Display", serif;
      font-weight: 500;
      font-size: clamp(
        80px,
        17vw,
        230px
      );
      line-height: 0.72;
      letter-spacing: -0.075em;
    }
    .hero-image {
      position: relative;
      width: min(62vw, 720px);
      margin-top: 80px;
      margin-left: auto;
      overflow: hidden;
      border: 1px solid var(--line);
      cursor: zoom-in;
    }
    .hero-image img {
      aspect-ratio: 4 / 5;
      object-fit: cover;
      transition:
        transform 1s cubic-bezier(.2,.7,.2,1);
    }
    .hero-image:hover img {
      transform: scale(1.025);
    }
    .hero-image-label {
      position: absolute;
      left: -55px;
      bottom: 25px;
      writing-mode: vertical-rl;
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: var(--grey);
    }
    /* Sections */
    .section {
      padding: 150px 0;
    }
    .section-inner {
      min-height: 500px;
    }
    .section-label {
      margin-bottom: 70px;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: var(--grey);
    }
    .empty-space {
      min-height: 350px;
    }
    /* Portfolio */
    .gallery {
      display: grid;
      grid-template-columns:
        1.35fr
        0.65fr;
      gap: 24px;
      align-items: start;
    }
    .gallery-column {
      display: grid;
      gap: 24px;
    }
    .gallery-column:nth-child(2) {
      padding-top: 180px;
    }
    .gallery-item {
      position: relative;
      overflow: hidden;
      padding: 0;
      border: 1px solid var(--line);
      background: #090909;
      cursor: zoom-in;
    }
    .gallery-item img {
      transition:
        transform 0.9s cubic-bezier(.2,.7,.2,1);
    }
    .gallery-item:hover img {
      transform: scale(1.035);
    }
    /* Social / Contact */
    .link-list {
      max-width: 800px;
    }
    .link {
      display: block;
      width: fit-content;
      padding: 12px 0 7px;
      border-bottom: 1px solid var(--white);
      font-family: "Playfair Display", serif;
      font-size: clamp(30px, 5vw, 60px);
      line-height: 1;
      transition:
        opacity 0.25s ease,
        color 0.25s ease;
    }
    .link:hover {
      opacity: 0.55;
    }
    /* Footer */
    footer {
      padding: 30px 0 45px;
      border-top: 1px solid var(--line);
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--grey);
    }
    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      background: rgba(0, 0, 0, 0.97);
      opacity: 0;
      visibility: hidden;
      transition:
        opacity 0.35s ease,
        visibility 0.35s ease;
    }
    .lightbox.open {
      opacity: 1;
      visibility: visible;
    }
    .lightbox img {
      max-width: 92vw;
      max-height: 90vh;
      width: auto;
      object-fit: contain;
    }
    .lightbox-close {
      position: absolute;
      top: 25px;
      right: 30px;
      padding: 0;
      border: 0;
      background: transparent;
      color: white;
      font-size: 32px;
      font-weight: 300;
      cursor: pointer;
      border-bottom: 1px solid white;
    }
    /* Reveal animation */
    .reveal {
      opacity: 0;
      transform: translateY(35px);
      transition:
        opacity 0.9s ease,
        transform 0.9s cubic-bezier(.2,.7,.2,1);
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }
    /* Accessibility */
    :focus-visible {
      outline: 1px solid var(--white);
      outline-offset: 6px;
    }
    /* Mobile */
    @media (max-width: 700px) {
      :root {
        --padding: 18px;
      }
      .nav {
        padding: 19px 0;
      }
      .hero {
        padding-top: 120px;
      }
      .hero-title {
        font-size: 22vw;
      }
      .hero-image {
        width: 82vw;
        margin-top: 55px;
      }
      .hero-image-label {
        display: none;
      }
      .section {
        padding: 95px 0;
      }
      .section-label {
        margin-bottom: 50px;
      }
      .empty-space {
        min-height: 250px;
      }
      .gallery {
        grid-template-columns: 1fr;
      }
      .gallery-column:nth-child(2) {
        padding-top: 0;
      }
      .link {
        font-size: 32px;
      }
      .menu-link {
        font-size: 17vw;
      }
      .lightbox {
        padding: 20px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <!-- MENU -->

<div class="menu-inner">

  <!-- LIGHTBOX -->

  ×
</button>
<img
  id="lightboxImage"
  src=""
  alt=""
>
  </div>
  <script>
    /* MENU */
    const menu = document.getElementById("menu");
    const menuButton = document.getElementById("menuButton");
    const menuLinks = document.querySelectorAll(".menu-link");
    function openMenu() {
      menu.classList.add("open");
      menu.setAttribute("aria-hidden", "false");
      menuButton.setAttribute("aria-expanded", "true");
      document.body.classList.add("no-scroll");
    }
    function closeMenu() {
      menu.classList.remove("open");
      menu.setAttribute("aria-hidden", "true");
      menuButton.setAttribute("aria-expanded", "false");
      document.body.classList.remove("no-scroll");
    }
    menuButton.addEventListener("click", () => {
      if (menu.classList.contains("open")) {
        closeMenu();
      } else {
        openMenu();
      }
    });
    menuLinks.forEach((link) => {
      link.addEventListener("click", () => {
        const target =
          document.getElementById(
            link.dataset.target
          );
        closeMenu();
        if (target) {
          target.scrollIntoView({
            behavior: "smooth"
          });
        }
      });
    });
    /* SCROLL REVEAL */
    const revealElements =
      document.querySelectorAll(".reveal");
    const revealObserver =
      new IntersectionObserver(
        (entries, observer) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) {
              return;
            }
            entry.target.classList.add(
              "visible"
            );
            observer.unobserve(
              entry.target
            );
          });
        },
        {
          threshold: 0.12
        }
      );
    revealElements.forEach((element) => {
      revealObserver.observe(element);
    });
    /* LIGHTBOX */
    const lightbox =
      document.getElementById("lightbox");
    const lightboxImage =
      document.getElementById(
        "lightboxImage"
      );
    const lightboxClose =
      document.getElementById(
        "lightboxClose"
      );
    const clickableImages =
      document.querySelectorAll(
        "[data-image]"
      );
    function openLightbox(image) {
      lightboxImage.src = image;
      lightbox.classList.add("open");
      lightbox.setAttribute(
        "aria-hidden",
        "false"
      );
      document.body.classList.add(
        "no-scroll"
      );
    }
    function closeLightbox() {
      lightbox.classList.remove(
        "open"
      );
      lightbox.setAttribute(
        "aria-hidden",
        "true"
      );
      document.body.classList.remove(
        "no-scroll"
      );
      setTimeout(() => {
        lightboxImage.src = "";
      }, 350);
    }
    clickableImages.forEach((element) => {
      element.addEventListener(
        "click",
        () => {
          openLightbox(
            element.dataset.image
          );
        }
      );
    });
    lightboxClose.addEventListener(
      "click",
      closeLightbox
    );
    lightbox.addEventListener(
      "click",
      (event) => {
        if (
          event.target === lightbox
        ) {
          closeLightbox();
        }
      }
    );
    document.addEventListener(
      "keydown",
      (event) => {
        if (event.key === "Escape") {
          if (
            lightbox.classList.contains(
              "open"
            )
          ) {
            closeLightbox();
          }
          if (
            menu.classList.contains(
              "open"
            )
          ) {
            closeMenu();
          }
        }
      }
    );
  </script>
</body>
